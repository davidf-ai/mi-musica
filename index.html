<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Mi música</title>
<style>
:root{--bg:#f1f3f8;--pn:#fff;--ink:#16203a;--mu:#66708a;--ln:#dde2ee;--ac:#2f5bea;--ai:#fff;--hue:225;--c1:#7aa2ff;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e121c;--pn:#171d2c;--ink:#e8ecf8;--mu:#8b95b0;--ln:#27304a;--ac:#7aa2ff;--ai:#0c1226}}
:root[data-theme=dark]{--bg:#0e121c;--pn:#171d2c;--ink:#e8ecf8;--mu:#8b95b0;--ln:#27304a;--ac:#7aa2ff;--ai:#0c1226}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
button,select,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h1{margin:0;font-size:24px}
.btn{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--pn)}.btn.m{background:var(--ac);color:var(--ai);border-color:var(--ac);font-weight:700}
.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--ln);margin-top:8px}
.tab{padding:10px 14px;color:var(--mu);white-space:nowrap;border-bottom:3px solid transparent}.tab.on{color:var(--ink);font-weight:700;border-color:var(--ac)}
#main{padding:14px;max-width:900px;margin:0 auto}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.in,.bar select,.sel{padding:8px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);color:var(--ink)}.in{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{position:relative;cursor:pointer}.card.cur .cn{color:var(--ac);font-weight:700}
.art{aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:42px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 65% 52%),hsl(calc(var(--h) + 60) 65% 42%))}
.art img,.art video{width:100%;height:100%;object-fit:cover}
.cn{margin-top:6px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{position:absolute;top:4px;right:4px;display:flex;gap:2px}
.cb button{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:14px}.cb .on{color:#ff6b6b}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;margin-bottom:8px;border-radius:14px;background:var(--pn);border:1px solid var(--ln);cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:40px 12px}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
h3{margin:18px 0 8px}
.menu{position:absolute;z-index:40;width:180px;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:6px;box-shadow:0 10px 30px -10px #0008}
.menu[hidden]{display:none}.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px}
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:20px;background:var(--pn);border:1px solid var(--ln);box-shadow:0 8px 28px -10px #0006;cursor:pointer}
#mini[hidden]{display:none}#mart{width:44px;flex:none}#mart .art{border-radius:12px;font-size:20px}
#mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:42px;height:42px;border-radius:50%;font-size:18px}
#full{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));color:#fff;background:linear-gradient(hsl(var(--hue) 45% 20%),#090c14 85%);transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility .3s;overflow:hidden}
#full.open{transform:none;visibility:visible}
.fh{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:center}.fh small{display:block;opacity:.65;letter-spacing:.08em}
.stage{position:relative;width:min(62vw,42vh,320px);aspect-ratio:1;margin:auto}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}.rt{fill:none;stroke:#fff3;stroke-width:1.2}
.rp{fill:none;stroke:var(--c1);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.disc{position:absolute;inset:7%;overflow:hidden;border-radius:50%;animation:sp 8s linear infinite;animation-play-state:paused;box-shadow:0 0 calc(30px + var(--b,0)*50px) -8px color-mix(in srgb,var(--c1) 80%,transparent);
background:repeating-radial-gradient(circle,#0003 0 1px,#0000 1px 5px),conic-gradient(hsl(var(--hue) 70% 55%),hsl(calc(var(--hue) + 60) 75% 60%),hsl(calc(var(--hue) + 120) 70% 50%),hsl(var(--hue) 70% 55%))}
.disc.on{animation-play-state:running}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.disc{animation:none}}
.disc[data-sh=squircle]{border-radius:26%}
.disc[data-sh=hexagon]{border-radius:0;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.disc[data-sh=diamond]{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.disc[data-s=rings]{background:repeating-radial-gradient(circle,hsl(var(--hue) 70% 50%) 0 11px,hsl(var(--hue) 75% 72%) 11px 22px)}
.disc[data-s=solid]{background:hsl(var(--hue) 70% 55%)}
.disc[data-s=glass]{background:hsl(var(--hue) 22% 38%)}
.disc[data-s=aurora]{background:conic-gradient(from 30deg,hsl(var(--hue) 85% 60%),hsl(calc(var(--hue) + 90) 85% 60%),hsl(calc(var(--hue) + 180) 85% 60%),hsl(calc(var(--hue) + 270) 85% 60%),hsl(var(--hue) 85% 60%))}
.disc[data-s=vinyl]:not(.hascv)::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#0e121c;border:6px solid hsl(var(--hue) 60% 48%)}
.disc[data-s=glass]:not(.hascv)::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font-size:min(30vw,120px);color:#fffa}
.cv{position:absolute;inset:0}.cv img,.cv video{width:100%;height:100%;object-fit:cover;display:block}
.ft{width:100%;display:flex;align-items:center;gap:10px;text-align:center}.ft div{flex:1;min-width:0}.ft p{margin:0;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ft small{opacity:.65}
#fav.on{color:#ff6b6b}
.sk{width:100%;display:flex;gap:10px;align-items:center;font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}.sk input{flex:1;accent-color:var(--c1)}
.ct{display:flex;align-items:center;gap:8px;margin:6px 0}.ct .ib{color:#fffb}.ct .on{color:var(--c1)}
.ct .pp{width:68px;height:68px;background:#fff;color:#111;font-size:26px}
.vl{width:100%;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;opacity:.85}.vl input{max-width:150px}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:#171d2c;border-radius:24px 24px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;z-index:5}
.sheet.open{transform:none}.sheet .r{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.sheet .in,.sheet select{background:#0e121c;border-color:#27304a;color:#fff}.sheet .btn{background:#0e121c;border-color:#27304a;color:#fff}
#eqb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}#eqb label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
#eqb input{writing-mode:vertical-lr;direction:rtl;height:120px;width:28px;accent-color:var(--ac)}
.viz{position:absolute;left:-40%;top:-40%;width:180%;height:180%;pointer-events:none}
#bgm{position:absolute;inset:0;z-index:0}#bgm::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000,#0009)}
#bgm img,#bgm video{width:100%;height:100%;object-fit:cover;display:block}
#full>:not(#bgm):not(.sheet){position:relative;z-index:1}.sheet{z-index:5}
.disc[data-mo=none]{animation-name:none}
.disc[data-mo=sway]{animation-name:sw;animation-timing-function:ease-in-out;animation-direction:alternate}
.disc[data-mo=float]{animation-name:fl;animation-timing-function:ease-in-out;animation-direction:alternate}
@keyframes sw{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}@keyframes fl{from{transform:translateY(-4%)}to{transform:translateY(4%)}}
.sheet input[type=color]{width:44px;height:34px;padding:0;border:0;background:none;margin-left:6px}
</style></head>
<body>
<div class="top"><div class="hd"><h1>Mi música</h1><button class="btn m" id="add">+ Añadir</button></div>
<div class="tabs"><button class="tab" data-v="songs">Canciones</button><button class="tab" data-v="lists">Listas</button><button class="tab" data-v="favs">Favoritas</button><button class="tab" data-v="set">Ajustes</button></div></div>
<div id="main"></div><div class="menu" id="menu" hidden></div>
<div id="mini" hidden><div id="mart"></div><div id="mn"></div><button class="ib" id="mpp" aria-label="Reproducir">▶</button><button class="ib" id="mnx" aria-label="Siguiente">⏭</button></div>

<section id="full" aria-label="Reproduciendo"><div id="bgm"></div>
 <div class="fh"><button class="ib" id="fclose" aria-label="Cerrar">⌄</button><div><small>Reproduciendo desde</small><b id="from">Canciones</b></div><button class="ib" id="fmore" aria-label="Personalizar">⋮</button></div>
 <div class="stage" id="stage"><canvas class="viz" id="viz"></canvas><svg class="ring" viewBox="0 0 100 100"><circle class="rt" cx="50" cy="50" r="48"/><circle class="rp" id="rp" cx="50" cy="50" r="48" pathLength="100"/></svg><div class="disc" id="disc" data-s="vinyl" data-sh="circle"><div class="cv" id="cv"></div></div></div>
 <div class="ft"><button class="ib" id="fav" aria-label="Favorita">♡</button><div><p id="ft">Nada sonando</p><small id="fs"></small></div></div>
 <div class="sk"><span id="cu">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición"><span id="du">0:00</span></div>
 <div class="ct"><button class="ib" id="shuf" aria-label="Aleatorio">⇄</button><button class="ib" id="prev" aria-label="Anterior">⏮</button><button class="ib pp" id="pp" aria-label="Reproducir">▶</button><button class="ib" id="next" aria-label="Siguiente">⏭</button><button class="ib" id="rep" aria-label="Repetir">↻</button></div>
 <div class="vl"><span>Vol</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volumen"></div>
 <div class="sheet" id="cust">
  <b>Personalizar esta canción</b>
  <label class="r">Nombre <input class="in" id="cn"></label>
  <label class="r">Color <input type="range" id="ch" min="0" max="360"></label>
  <label class="r">Estilo <select class="sel" id="cs"><option value="vinyl">Vinilo</option><option value="rings">Anillos</option><option value="solid">Sólido</option><option value="glass">Cristal</option><option value="aurora">Aurora</option><option value="custom">Mis colores</option></select></label>
  <div class="r"><span>Colores (mezcla)</span><span><input type="color" id="k0" aria-label="Color 1"><input type="color" id="k1" aria-label="Color 2"><input type="color" id="k2" aria-label="Color 3"></span></div>
  <label class="r">Degradado <select class="sel" id="cg"><option value="linear">Lineal</option><option value="radial">Radial</option><option value="conic">Cónico</option><option value="solid">Un solo color</option></select></label>
  <label class="r">Movimiento del disco <select class="sel" id="cm"><option value="spin">Girar</option><option value="none">Quieto</option><option value="sway">Balanceo</option><option value="float">Flotar</option></select></label>
  <label class="r">Velocidad <select class="sel" id="cp"><option value="14">Lenta</option><option value="8">Normal</option><option value="4">Rápida</option></select></label>
  <label class="r">Efecto con el sonido <select class="sel" id="cz"><option value="wave">Ondas (anillo)</option><option value="bars">Barras</option><option value="vapor">Vapor</option><option value="off">Ninguno</option></select></label>
  <label class="r">Fondo <select class="sel" id="cb"><option value="auto">Automático</option><option value="grad">Degradado con mis colores</option><option value="media">Imagen o video</option><option value="black">Negro</option></select></label>
  <div class="r"><button class="btn" id="bimg">Fondo: imagen o video</button><button class="btn" id="bdel">Quitar fondo</button></div>
  <input type="file" id="bfile" accept="image/*,video/*" hidden>
  <label class="r">Forma <select class="sel" id="csh"><option value="circle">Círculo (gira)</option><option value="squircle">Cuadrado suave</option><option value="hexagon">Hexágono</option><option value="diamond">Rombo</option></select></label>
  <label class="r">Reacción a los graves <select class="sel" id="cr"><option value="0">Sin movimiento</option><option value="1">Suave</option><option value="2">Fuerte</option></select></label>
  <label class="r"><span>Colorear toda la app</span><input type="checkbox" id="cac"></label>
  <div class="r"><button class="btn" id="cimg">Portada: imagen o video</button><button class="btn" id="cdel">Quitar</button><button class="btn" id="crst">Restablecer</button></div>
  <input type="file" id="cfile" accept="image/*,video/*" hidden>
 </div>
</section>
<input type="file" id="file" accept="audio/*" multiple hidden>

<script>
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const A=new Audio();A.volume=.8;
let tracks=[],by={},cur=null,ids=[],shuf=false,rep=0,view='songs',open=null,sortM='add',lists={},favs=new Set(),meta={},eqv=[0,0,0,0,0],db,cov={},ctx,filt=[],an,fd,stopEnd=false,sleepT,raf=0,q='',from='Canciones';
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim();
const fmt=t=>{if(!isFinite(t))return'0:00';const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=String(Math.floor(t%60)).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+s:m+':'+s};
const nm=t=>(meta[t.id]||{}).n||t.name,hu=t=>(meta[t.id]||{}).h??hash(t.name),mm=t=>meta[t.id]||(meta[t.id]={});
const sv=()=>{try{localStorage.setItem('mm-prefs',JSON.stringify({favs:[...favs],lists,eq:eqv,sort:sortM,spd:A.playbackRate,shuffle:shuf,repeat:rep,theme:document.documentElement.dataset.theme||''}));localStorage.setItem('mm-meta',JSON.stringify(meta))}catch(e){}};

/* Almacenamiento (IndexedDB): t = canciones, c = portadas */
const idb=()=>new Promise(r=>{try{const o=indexedDB.open('mi-musica',2);o.onupgradeneeded=()=>{const d=o.result;['t','c'].forEach(n=>d.objectStoreNames.contains(n)||d.createObjectStore(n,{keyPath:'id'}))};o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r()}catch(e){r()}});
const os=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const all=s=>new Promise(r=>{try{const g=os(s).getAll();g.onsuccess=()=>r(g.result||[]);g.onerror=()=>r([])}catch(e){r([])}});
const put=(s,o)=>{try{os(s,'readwrite').put(o)}catch(e){}},del=(s,id)=>{try{os(s,'readwrite').delete(id)}catch(e){}};

/* Elementos visuales */
function media(t,small){return mk(cov[t.id],small)}
function mk(c,small){if(!c)return null;const v=c.type==='video',e=document.createElement(v?'video':'img');e.src=c.url+(v&&small?'#t=0.1':'');if(v){e.muted=true;e.loop=true;e.playsInline=true;if(small)e.preload='metadata';else e.autoplay=true}else e.alt='';return e}
function art(t){const d=el('div','art');d.style.setProperty('--h',hu(t));const m=media(t,true);if(m)d.appendChild(m);else d.textContent='♪';return d}
const shown=()=>tracks.filter(t=>(view==='favs'?favs.has(t.id):view==='lists'&&open?(lists[open]||[]).includes(t.id):true)&&(!q||nm(t).toLowerCase().includes(q)));
const cmp={add:(a,b)=>parseInt(a.id)-parseInt(b.id),az:(a,b)=>nm(a).localeCompare(nm(b),'es'),za:(a,b)=>nm(b).localeCompare(nm(a),'es')};

function card(t){const c=el('div','card'+(t.id===cur?' cur':''));c.dataset.id=t.id;c.appendChild(art(t));const n=el('div','cn');n.textContent=nm(t);c.appendChild(n);
  const f=favs.has(t.id);c.appendChild(el('div','cb',"<button class='fv"+(f?' on':'')+"' aria-label='Favorita'>"+(f?'♥':'♡')+"</button><button class='pl' aria-label='Añadir a lista'>＋</button><button class='rm' aria-label='Quitar'>✕</button>"));
  c.onclick=e=>{const x=e.target.closest('button');if(!x)return play(t.id,shown().map(s=>s.id),true);
    if(x.classList.contains('fv')){favs.has(t.id)?favs.delete(t.id):favs.add(t.id);sv();drawGrid();favUI()}
    else if(x.classList.contains('pl'))menu(t.id,x);
    else if(view==='lists'&&open){lists[open]=lists[open].filter(i=>i!==t.id);sv();drawGrid()}
    else if(confirm('¿Quitar esta canción de tu biblioteca?'))rm(t)};
  return c}
function rm(t){del('t',t.id);del('c',t.id);del('c','bg-'+t.id);favs.delete(t.id);delete meta[t.id];for(const k in lists)lists[k]=lists[k].filter(x=>x!==t.id);
  tracks=tracks.filter(x=>x!==t);delete by[t.id];ids=ids.filter(x=>x!==t.id);if(cur===t.id){A.pause();A.removeAttribute('src');cur=null;skin(true)}sv();drawGrid();mini()}
function drawGrid(){const g=$('#grid');if(!g)return;sortT();g.innerHTML='';const l=shown();
  if(!l.length){g.className='';g.innerHTML=tracks.length?"<div class='empty'>Nada por aquí todavía.</div>":"<div class='empty'><b>Tu biblioteca está vacía</b>Pulsa “+ Añadir” y elige varias canciones de tu celular a la vez.</div>";return}
  g.className='grid';l.forEach(t=>g.appendChild(card(t)));const c=$('#cnt');if(c)c.textContent=l.length+' canciones'}
const sortT=()=>tracks.sort(cmp[sortM]||cmp.add);

function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===view));const m=$('#main');m.innerHTML='';
  if(view==='set')return settings(m);
  if(view==='lists'&&!open){const b=el('div','bar',"<input class='in' id='nl' placeholder='Nueva lista' aria-label='Nombre de la lista'><button class='btn m' id='mk'>Crear</button>");m.appendChild(b);
    b.querySelector('#mk').onclick=()=>{const n=$('#nl').value.trim();if(n&&!lists[n]){lists[n]=[];sv();render()}};
    const ks=Object.keys(lists);if(!ks.length)m.appendChild(el('div','empty',"<b>Sin listas</b>Crea una y añade canciones con el botón ＋ de cada tarjeta."));
    ks.forEach(n=>{const r=el('div','row');r.innerHTML='<b></b><span>'+lists[n].length+' canciones</span>';r.firstChild.textContent=n;r.onclick=()=>{open=n;render()};m.appendChild(r)});return}
  const b=el('div','bar');
  if(view==='lists'){const bk=el('button','btn','← Listas');bk.onclick=()=>{open=null;q='';render()};const t=el('b');t.textContent=open;const d=el('button','btn','Borrar lista');d.onclick=()=>{if(confirm('¿Borrar esta lista?')){delete lists[open];open=null;sv();render()}};b.append(bk,t,d);m.appendChild(b);}
  const b2=el('div','bar',"<input class='in' id='sq' type='search' placeholder='Buscar' aria-label='Buscar'><span id='cnt'></span>");b2.firstChild.value=q;b2.firstChild.oninput=e=>{q=e.target.value.toLowerCase();drawGrid()};
  if(view==='songs'){const s=el('select','sel',"<option value='add'>Añadidas</option><option value='az'>A–Z</option><option value='za'>Z–A</option>");s.value=sortM;s.onchange=e=>{sortM=e.target.value;sv();drawGrid()};b2.appendChild(s)}
  m.appendChild(b2);m.appendChild(el('div','','')).id='grid';drawGrid()}

function settings(m){
  m.innerHTML="<h3>Apariencia</h3><button class='btn' id='th'>Cambiar claro / oscuro</button><h3>Reproducción</h3><div class='bar'><label>Velocidad <select class='sel' id='spd'><option value='0.75'>0.75x</option><option value='1'>1x</option><option value='1.25'>1.25x</option><option value='1.5'>1.5x</option><option value='2'>2x</option></select></label><label>Apagar en <select class='sel' id='sl'><option value='0'>No</option><option value='15'>15 min</option><option value='30'>30 min</option><option value='45'>45 min</option><option value='60'>60 min</option><option value='end'>Al terminar la canción</option></select></label></div><h3>Ecualizador</h3><select class='sel' id='pre'></select><div id='eqb'></div><h3>Ayuda</h3><p style='color:var(--mu)'>Tus canciones, portadas y ajustes se guardan en este dispositivo y funcionan sin conexión. No borres los datos del sitio desde los ajustes del celular o perderás la biblioteca.</p>";
  $('#th').onclick=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dk?'light':'dark';sv()};
  $('#spd').value=String(A.playbackRate);$('#spd').onchange=e=>{A.defaultPlaybackRate=A.playbackRate=+e.target.value;sv()};
  $('#sl').onchange=e=>{clearTimeout(sleepT);stopEnd=false;const v=e.target.value;if(v==='end')stopEnd=true;else if(+v>0)sleepT=setTimeout(()=>{A.pause()},+v*6e4)};
  const PRE={'Plano':[0,0,0,0,0],'Más graves':[7,4,0,0,0],'Voces':[-2,0,4,3,0],'Más agudos':[0,0,0,4,7],'Rock':[5,3,-2,3,5],'Pop':[-1,3,4,2,-1]},N=['60 Hz','230','910','3.6k','14k'];
  const pre=$('#pre');pre.innerHTML='<option value="">Personalizado</option>'+Object.keys(PRE).map(k=>'<option>'+k+'</option>').join('');pre.value=Object.keys(PRE).find(k=>PRE[k].join()===eqv.join())||'';
  N.forEach((n,i)=>{const l=el('label','',"<input type='range' min='-12' max='12' aria-label='"+n+"'><span>"+n+'</span>'),r=l.firstChild;r.value=eqv[i];r.oninput=()=>{eqv[i]=+r.value;if(filt[i])filt[i].gain.value=eqv[i];pre.value='';sv()};$('#eqb').appendChild(l)});
  pre.onchange=e=>{const p=PRE[e.target.value];if(!p)return;eqv=[...p];filt.forEach((f,i)=>f.gain.value=eqv[i]);document.querySelectorAll('#eqb input').forEach((r,i)=>r.value=eqv[i]);sv()}}

/* Menú ＋ listas */
function menu(id,btn){const m=$('#menu'),ks=Object.keys(lists);m.innerHTML=ks.length?'':'<p style="padding:8px;margin:0">Crea una lista primero (pestaña Listas)</p>';
  ks.forEach(n=>{const b=el('button');b.textContent=n;b.onclick=()=>{if(!lists[n].includes(id))lists[n].push(id);sv();m.hidden=true};m.appendChild(b)});
  const r=btn.getBoundingClientRect();m.style.top=r.bottom+scrollY+'px';m.style.left=Math.max(8,r.right+scrollX-180)+'px';m.hidden=false}
document.addEventListener('click',e=>{if(!e.target.closest('#menu,.pl'))$('#menu').hidden=true});

/* Reproducción */
function play(id,list,openFull){const t=by[id];if(!t)return;if(list)ids=list;from=view==='favs'?'Favoritas':view==='lists'&&open?open:'Canciones';cur=id;A.src=t.url;skin(true);A.play().catch(()=>{});if(openFull)$('#full').classList.add('open');
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('cur',c.dataset.id===id))}
function nx(auto){if(!ids.length)return;if(auto&&rep===2)return play(cur);if(shuf&&ids.length>1){let n;do{n=ids[Math.random()*ids.length|0]}while(n===cur);return play(n)}let k=ids.indexOf(cur)+1;if(k>=ids.length){if(rep===1||!auto)k=0;else{A.pause();return}}play(ids[k])}
function pv(){if(A.currentTime>3)A.currentTime=0;else{const k=ids.indexOf(cur);play(ids[k<=0?ids.length-1:k-1])}}
function tg(){if(!cur){const l=shown();if(l.length)play(l[0].id,l.map(x=>x.id));return}A.paused?A.play().catch(()=>{}):A.pause()}

function skin(rebuild){const t=by[cur],r=document.documentElement,d=$('#disc');r.style.removeProperty('--ac');r.style.removeProperty('--ai');
  if(rebuild)$('#cv').innerHTML='';
  if(!t){r.style.setProperty('--hue',225);r.style.setProperty('--c1','#7aa2ff');d.classList.remove('hascv');$('#ft').textContent='Nada sonando';$('#fs').textContent='';document.title='Mi música';mini();return}
  const m=meta[t.id]||{};r.style.setProperty('--hue',hu(t));d.dataset.s=m.s||'vinyl';d.dataset.sh=m.sh||'circle';const k=cols(t);r.style.setProperty('--c1',k[0]);d.dataset.mo=m.mo||'spin';d.style.animationDuration=(m.sp||8)+'s';d.style.background=m.s==='custom'?grad(m,k):'';bgSkin(t,m,k);
  if(rebuild){const md=media(t,false);if(md)$('#cv').appendChild(md);d.classList.toggle('hascv',!!md);fill(t)}
  if(m.a){r.style.setProperty('--ac',k[0]);r.style.setProperty('--ai','#fff')}
  $('#ft').textContent=nm(t);$('#fs').textContent=(ids.indexOf(cur)+1)+' / '+ids.length;$('#from').textContent=from;document.title=nm(t)+' · Mi música';
  favUI();mini();vsync();try{navigator.mediaSession.metadata=new MediaMetadata({title:nm(t),artist:'Mi música'})}catch(e){}}
function mini(){const t=by[cur],m=$('#mini');m.hidden=!t;if(!t)return;$('#mart').replaceChildren(art(t));$('#mn').textContent=nm(t)}
function favUI(){const b=$('#fav'),f=favs.has(cur);b.textContent=f?'♥':'♡';b.classList.toggle('on',f)}
function vsync(){document.querySelectorAll('#cv video,#bgm video').forEach(v=>A.paused?v.pause():v.play().catch(()=>{}))}
function ui(){const on=!A.paused&&!!A.src;$('#pp').textContent=$('#mpp').textContent=on?'⏸':'▶';$('#disc').classList.toggle('on',on);vsync();if(on&&!raf)raf=requestAnimationFrame(tick)}

/* Audio: ecualizador + análisis de graves */
function ensureCtx(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();let n=ctx.createMediaElementSource(A);[60,230,910,3600,14000].forEach((f,i)=>{const b=ctx.createBiquadFilter();b.type=i?i==4?'highshelf':'peaking':'lowshelf';b.frequency.value=f;b.gain.value=eqv[i];filt.push(b);n.connect(b);n=b});an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.55;fd=new Uint8Array(512);n.connect(an);an.connect(ctx.destination)}catch(e){ctx=null}}
function tick(){raf=0;const st=$('#stage');if(!an||A.paused||!cur||!$('#full').classList.contains('open')){st.style.transform='';st.style.setProperty('--b',0);$('#disc').style.setProperty('--b',0);const z=$('#viz');z.getContext('2d').clearRect(0,0,z.width,z.height);return}
  an.getByteFrequencyData(fd);let s=0;for(let i=1;i<5;i++)s+=fd[i];let md=0;for(let i=7;i<80;i++)md+=fd[i];const l=s/4/255,k=[0,.1,.22][(meta[cur]||{}).r??1];viz(l,md/73/255);
  st.style.transform='scale('+(1+l*l*k*1.6).toFixed(3)+')';$('#disc').style.setProperty('--b',l.toFixed(2));raf=requestAnimationFrame(tick)}

A.onplay=()=>{ensureCtx();if(ctx&&ctx.state==='suspended')ctx.resume();ui()};A.onpause=ui;
A.onended=()=>{if(stopEnd){stopEnd=false;return}nx(true)};
A.onloadedmetadata=()=>{$('#du').textContent=fmt(A.duration)};
A.ontimeupdate=()=>{$('#cu').textContent=fmt(A.currentTime);if(A.duration){$('#seek').value=A.currentTime/A.duration*1000;$('#rp').style.strokeDashoffset=100-A.currentTime/A.duration*100}};
$('#seek').oninput=e=>{if(A.duration)A.currentTime=e.target.value/1000*A.duration};
$('#vol').oninput=e=>{A.volume=e.target.value/100};
$('#pp').onclick=$('#mpp').onclick=e=>{e.stopPropagation();tg()};$('#next').onclick=$('#mnx').onclick=e=>{e.stopPropagation();nx(false)};$('#prev').onclick=pv;
$('#shuf').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf);sv()};
$('#rep').onclick=e=>{rep=(rep+1)%3;e.currentTarget.classList.toggle('on',rep>0);e.currentTarget.textContent=rep===2?'↻1':'↻';sv()};
$('#fav').onclick=()=>{if(!cur)return;favs.has(cur)?favs.delete(cur):favs.add(cur);sv();favUI();if(view==='favs')drawGrid()};
$('#mini').onclick=()=>{$('#full').classList.add('open');if(!raf)raf=requestAnimationFrame(tick)};
$('#fclose').onclick=()=>{$('#full').classList.remove('open');$('#cust').classList.remove('open')};
$('#fmore').onclick=()=>$('#cust').classList.toggle('open');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;open=null;q='';render()});
if('mediaSession' in navigator){try{const s=navigator.mediaSession;s.setActionHandler('play',tg);s.setActionHandler('pause',tg);s.setActionHandler('nexttrack',()=>nx(false));s.setActionHandler('previoustrack',pv)}catch(e){}}

/* Colores, fondo y efecto visual */
let P=[];const sm=new Float32Array(96),dpr=Math.min(devicePixelRatio||1,2);
const hex=(h,s,l)=>{h=((h%360)+360)%360;s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)};
const cols=t=>(meta[t.id]||{}).k||[hex(hu(t),85,62),hex(hu(t)+60,85,60),hex(hu(t)+120,80,55)];
function grad(m,k){const g=m.g||'linear';return g==='solid'?k[0]:g==='radial'?'radial-gradient(circle,'+k.join(',')+')':g==='conic'?'conic-gradient(from 30deg,'+k.join(',')+','+k[0]+')':'linear-gradient(135deg,'+k.join(',')+')'}
function bgSkin(t,m,k){const b=$('#bgm'),mode=m.b||'auto',c=cov['bg-'+t.id],sig=mode+(mode==='media'&&c?c.url:'')+(mode==='grad'?k.join()+(m.g||''):'');
  if(b.dataset.s===sig)return;b.dataset.s=sig;b.innerHTML='';b.style.background='';
  if(mode==='black')b.style.background='#000';else if(mode==='grad')b.style.background='linear-gradient(160deg,'+k.join(',')+')';
  else if(mode==='media'){const e=mk(c,false);if(e)b.appendChild(e)}vsync()}
function viz(bass,mid){const c=$('#viz'),S=$('#stage').offsetWidth;if(!S||!cur)return;const W=Math.round(S*1.8*dpr);if(c.width!==W)c.width=c.height=W;
  const g=c.getContext('2d'),mode=(meta[cur]||{}).z||'wave',k=cols(by[cur]),L=S*1.8,cx=L/2,r0=S*.53;
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,L,L);g.shadowBlur=0;if(mode==='off')return;
  if(mode==='vapor'){g.globalCompositeOperation='lighter';const n=Math.floor(bass*5+mid*4+(Math.random()<.4?1:0));
    for(let i=0;i<n&&P.length<140;i++){const a=Math.random()*6.283,v=.4+mid*2.5;P.push({x:cx+Math.cos(a)*r0*.9,y:cx+Math.sin(a)*r0*.9,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.15,r:S*(.05+bass*.1),l:1,c:Math.random()<.5?k[0]:k[1]})}
    P=P.filter(p=>p.l>0);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vx+=(Math.random()-.5)*.15;p.vy+=(Math.random()-.5)*.15-.01;p.r*=1.012;p.l-=.012;
      const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);gr.addColorStop(0,p.c);gr.addColorStop(1,p.c+'00');g.globalAlpha=Math.max(0,p.l)*.3;g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}
    g.globalAlpha=1;g.globalCompositeOperation='source-over';return}
  const N=mode==='wave'?96:72;for(let i=0;i<N;i++){const kk=Math.abs(i-N/2)/(N/2);sm[i]=sm[i]*.55+fd[2+Math.floor(kk*70)]/255*.45}
  if(mode==='bars'){g.lineCap='round';g.lineWidth=3.5;for(let i=0;i<N;i++){const a=i/N*6.283-1.5708,l=S*.03+sm[i]*S*.26;g.strokeStyle=i%2?k[1]:k[0];g.beginPath();g.moveTo(cx+Math.cos(a)*r0,cx+Math.sin(a)*r0);g.lineTo(cx+Math.cos(a)*(r0+l),cx+Math.sin(a)*(r0+l));g.stroke()}return}
  [[k[0],1,3],[k[1],.55,2]].forEach(([col,amp,w])=>{const pts=[];for(let i=0;i<N;i++){const a=i/N*6.283-1.5708,r=r0+sm[i]*S*.26*amp;pts.push([cx+Math.cos(a)*r,cx+Math.sin(a)*r])}
    g.lineWidth=w;g.strokeStyle=col;g.shadowColor=col;g.shadowBlur=16;g.beginPath();g.moveTo((pts[N-1][0]+pts[0][0])/2,(pts[N-1][1]+pts[0][1])/2);
    for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N];g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}g.closePath();g.stroke()});g.shadowBlur=0}

/* Personalización por canción */
function fill(t){const m=meta[t.id]||{};$('#cn').value=m.n||t.name;$('#ch').value=hu(t);$('#cs').value=m.s||'vinyl';$('#csh').value=m.sh||'circle';$('#cr').value=String(m.r??1);$('#cac').checked=!!m.a;const k=cols(t);$('#k0').value=k[0];$('#k1').value=k[1];$('#k2').value=k[2];$('#cg').value=m.g||'linear';$('#cm').value=m.mo||'spin';$('#cp').value=String(m.sp||8);$('#cz').value=m.z||'wave';$('#cb').value=m.b||'auto'}
function setM(k,v){const t=by[cur];if(!t)return;const m=mm(t);if(v==='')delete m[k];else m[k]=v;sv();skin(false);drawGrid()}
$('#cn').oninput=e=>setM('n',e.target.value.trim());$('#ch').oninput=e=>setM('h',+e.target.value);
$('#cs').onchange=e=>setM('s',e.target.value==='vinyl'?'':e.target.value);$('#csh').onchange=e=>setM('sh',e.target.value==='circle'?'':e.target.value);
$('#cr').onchange=e=>setM('r',+e.target.value);$('#cac').onchange=e=>setM('a',e.target.checked?1:'');
$('#cimg').onclick=()=>{if(cur)$('#cfile').click()};
$('#cfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;if(cov[cur])URL.revokeObjectURL(cov[cur].url);const type=f.type.startsWith('video')?'video':'image';cov[cur]={url:URL.createObjectURL(f),type};put('c',{id:cur,blob:f,type});if(type==='video'){const m=mm(by[cur]);if(!m.mo)m.mo='none';sv()}skin(true);drawGrid();mini()};
$('#cdel').onclick=()=>{if(!cur)return;delete cov[cur];del('c',cur);skin(true);drawGrid();mini()};
$('#crst').onclick=()=>{const t=by[cur];if(!t)return;delete meta[t.id];delete cov[cur];del('c',cur);delete cov['bg-'+cur];del('c','bg-'+cur);sv();skin(true);drawGrid()};

/* Colores, movimiento, efecto y fondo */
['k0','k1','k2'].forEach(i=>$('#'+i).oninput=()=>{const t=by[cur];if(!t)return;const m=mm(t);m.k=[$('#k0').value,$('#k1').value,$('#k2').value];if(m.s!=='custom'){m.s='custom';$('#cs').value='custom'}sv();skin(false)});
$('#cg').onchange=e=>setM('g',e.target.value==='linear'?'':e.target.value);
$('#cm').onchange=e=>setM('mo',e.target.value==='spin'?'':e.target.value);
$('#cp').onchange=e=>setM('sp',e.target.value==='8'?'':+e.target.value);
$('#cz').onchange=e=>setM('z',e.target.value==='wave'?'':e.target.value);
$('#cb').onchange=e=>setM('b',e.target.value==='auto'?'':e.target.value);
$('#bimg').onclick=()=>{if(cur)$('#bfile').click()};
$('#bfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;const key='bg-'+cur;if(cov[key])URL.revokeObjectURL(cov[key].url);const type=f.type.startsWith('video')?'video':'image';cov[key]={url:URL.createObjectURL(f),type};put('c',{id:key,blob:f,type});mm(by[cur]).b='media';sv();$('#cb').value='media';skin(false)};
$('#bdel').onclick=()=>{if(!cur)return;const key='bg-'+cur;delete cov[key];del('c',key);delete mm(by[cur]).b;sv();$('#cb').value='auto';skin(false)};

/* Añadir canciones (varias a la vez) */
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=e=>{add(e.target.files);e.target.value=''};
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();add(e.dataTransfer.files)});
function add(files){let first=null;for(const f of files){if(!(f.type.startsWith('audio/')||/\.(mp3|m4a|aac|wav|ogg|opus|flac|wma)$/i.test(f.name)))continue;
  const id=Date.now()+'-'+Math.random().toString(36).slice(2,7),t={id,name:clean(f.name),url:URL.createObjectURL(f)};tracks.push(t);by[id]=t;put('t',{id,name:t.name,blob:f});first=first||t}
  if(view!=='songs'){view='songs';open=null}render();
  if(!cur&&first){ids=tracks.map(x=>x.id);cur=first.id;A.src=first.url;skin(true)}}

/* Inicio */
(async()=>{
  try{const p=JSON.parse(localStorage.getItem('mm-prefs')||'{}');if(p.theme)document.documentElement.dataset.theme=p.theme;favs=new Set(p.favs||[]);lists=p.lists||{};eqv=p.eq||eqv;sortM=p.sort||'add';shuf=!!p.shuffle;rep=p.repeat||0;
    if(p.spd)A.defaultPlaybackRate=A.playbackRate=p.spd;$('#shuf').classList.toggle('on',shuf);$('#rep').classList.toggle('on',rep>0);$('#rep').textContent=rep===2?'↻1':'↻';
    meta=JSON.parse(localStorage.getItem('mm-meta')||'{}')}catch(e){}
  await idb();
  (await all('t')).forEach(o=>{const t={id:o.id,name:o.name,url:URL.createObjectURL(o.blob)};tracks.push(t);by[t.id]=t});
  (await all('c')).forEach(o=>{cov[o.id]={url:URL.createObjectURL(o.blob),type:o.type}});
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body></html>
