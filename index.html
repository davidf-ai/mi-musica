<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Mi música</title>
<style>
:root{--bg:#f1f3f8;--pn:#fff;--ink:#16203a;--mu:#66708a;--ln:#dde2ee;--ac:#2f5bea;--ai:#fff;--hue:225;--c1:#7aa2ff;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e121c;--pn:#171d2c;--ink:#e8ecf8;--mu:#8b95b0;--ln:#27304a;--ac:#7aa2ff;--ai:#0c1226}}
:root[data-theme=dark]{--bg:#0e121c;--pn:#171d2c;--ink:#e8ecf8;--mu:#8b95b0;--ln:#27304a;--ac:#7aa2ff;--ai:#0c1226}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
button,select,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h1{margin:0;font-size:24px}
.btn{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--pn)}.btn.m{background:var(--ac);color:var(--ai);border-color:var(--ac);font-weight:700}
.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--ln);margin-top:8px}
.tab{padding:10px 14px;color:var(--mu);white-space:nowrap;border-bottom:3px solid transparent}.tab.on{color:var(--ink);font-weight:700;border-color:var(--ac)}
#main{padding:14px;max-width:900px;margin:0 auto}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.in,.bar select,.sel{padding:8px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);color:var(--ink)}.in{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{position:relative;cursor:pointer}.card.cur .cn{color:var(--ac);font-weight:700}
.art{aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:42px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 65% 52%),hsl(calc(var(--h) + 60) 65% 42%))}
.art img,.art video{width:100%;height:100%;object-fit:cover}
.cn{margin-top:6px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{position:absolute;top:4px;right:4px;display:flex;gap:2px}
.cb button{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:14px}.cb .on{color:#ff6b6b}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;margin-bottom:8px;border-radius:14px;background:var(--pn);border:1px solid var(--ln);cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:40px 12px}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
h3{margin:18px 0 8px}
.menu{position:absolute;z-index:40;width:180px;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:6px;box-shadow:0 10px 30px -10px #0008}
.menu[hidden]{display:none}.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px}
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:20px;background:var(--pn);border:1px solid var(--ln);box-shadow:0 8px 28px -10px #0006;cursor:pointer}
#mini[hidden]{display:none}#mart{width:44px;flex:none}#mart .art{border-radius:12px;font-size:20px}
#mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:42px;height:42px;border-radius:50%;font-size:18px}
#full{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));color:#fff;background:linear-gradient(hsl(var(--hue) 45% 20%),#090c14 85%);transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility .3s;overflow:hidden}
#full.open{transform:none;visibility:visible}
.fh{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:center}.fh small{display:block;opacity:.65;letter-spacing:.08em}
.stage{position:relative;width:min(62vw,42vh,320px);aspect-ratio:1;margin:auto}
.ring{position:absolute;inset:0}.rt,.rp{stroke-linejoin:round}.rt{fill:none;stroke:#fff3;stroke-width:1.2}
.rp{fill:none;stroke:var(--c1);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.disc{position:absolute;inset:7%;overflow:hidden;border-radius:50%;animation:sp 8s linear infinite;animation-play-state:paused;box-shadow:0 0 calc(30px + var(--b,0)*50px) -8px color-mix(in srgb,var(--c1) 80%,transparent);
background:repeating-radial-gradient(circle,#0003 0 1px,#0000 1px 5px),conic-gradient(hsl(var(--hue) 70% 55%),hsl(calc(var(--hue) + 60) 75% 60%),hsl(calc(var(--hue) + 120) 70% 50%),hsl(var(--hue) 70% 55%))}
.disc.on{animation-play-state:running}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.disc{animation:none}}
.disc[data-sh=squircle]{border-radius:26%}
.disc[data-sh=hexagon]{border-radius:0;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.disc[data-sh=diamond]{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.disc[data-s=rings]{background:repeating-radial-gradient(circle,hsl(var(--hue) 70% 50%) 0 11px,hsl(var(--hue) 75% 72%) 11px 22px)}
.disc[data-s=solid]{background:hsl(var(--hue) 70% 55%)}
.disc[data-s=glass]{background:hsl(var(--hue) 22% 38%)}
.disc[data-s=aurora]{background:conic-gradient(from 30deg,hsl(var(--hue) 85% 60%),hsl(calc(var(--hue) + 90) 85% 60%),hsl(calc(var(--hue) + 180) 85% 60%),hsl(calc(var(--hue) + 270) 85% 60%),hsl(var(--hue) 85% 60%))}
.disc[data-s=vinyl]:not(.hascv)::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#0e121c;border:6px solid hsl(var(--hue) 60% 48%)}
.disc[data-s=glass]:not(.hascv)::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font-size:min(30vw,120px);color:#fffa}
.cv{position:absolute;inset:0}.cv img,.cv video{width:100%;height:100%;object-fit:cover;display:block}
.ft{width:100%;display:flex;align-items:center;gap:10px;text-align:center}.ft div{flex:1;min-width:0}.ft p{margin:0;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ft small{opacity:.65}
#fav.on{color:#ff6b6b}
.sk{width:100%;display:flex;gap:10px;align-items:center;font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}.sk input{flex:1;accent-color:var(--c1)}
.ct{display:flex;align-items:center;gap:8px;margin:6px 0}.ct .ib{color:#fffb}.ct .on{color:var(--c1)}
.ct .pp{width:68px;height:68px;background:#fff;color:#111;font-size:26px}
.vl{width:100%;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;opacity:.85}.vl input{max-width:150px}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:#171d2c;border-radius:24px 24px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;z-index:5}
.sheet.open{transform:none}.sheet .r{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.sheet .in,.sheet select{background:#0e121c;border-color:#27304a;color:#fff}.sheet .btn{background:#0e121c;border-color:#27304a;color:#fff}
#eqb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}#eqb label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
#eqb input{writing-mode:vertical-lr;direction:rtl;height:120px;width:28px;accent-color:var(--ac)}
.viz{position:absolute;left:-40%;top:-40%;width:180%;height:180%;pointer-events:none}
#bgm{position:absolute;inset:0;z-index:0}#bgm::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000,#0009)}
#bgm img,#bgm video{width:100%;height:100%;object-fit:cover;display:block}
#full>:not(#bgm):not(.sheet):not(#fl){position:relative;z-index:1}.sheet{z-index:5}
.disc[data-mo=none]{animation-name:none}
.disc[data-mo=sway]{animation-name:sw;animation-timing-function:ease-in-out;animation-direction:alternate}
.disc[data-mo=float]{animation-name:fl;animation-timing-function:ease-in-out;animation-direction:alternate}
@keyframes sw{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}@keyframes fl{from{transform:translateY(-4%)}to{transform:translateY(4%)}}
.sheet input[type=color]{width:44px;height:34px;padding:0;border:0;background:none;margin-left:6px}
.fh,.ft,.sk,.vl,.ct{max-width:560px}
.sk input,.vl input{accent-color:var(--c1)}.vl input{flex:1;max-width:none}
.sheet{max-width:560px;margin:0 auto}
#fl{position:absolute;inset:0;z-index:2;pointer-events:none;background:#fff;opacity:0}#fl.on{animation:fb .28s}@keyframes fb{0%{opacity:.5}100%{opacity:0}}
.stage.bs{animation:bs .22s}@keyframes bs{25%{transform:translate(-3%,2%) rotate(-1.5deg)}50%{transform:translate(3%,-2%) rotate(1.5deg)}75%{transform:translate(-2%,-1%)}}
.stage.bg2{animation:gl .25s}@keyframes gl{20%{filter:drop-shadow(7px 0 #f0f) drop-shadow(-7px 0 #0ff);transform:translateX(-2%)}60%{filter:drop-shadow(-6px 0 #f0f) drop-shadow(6px 0 #0ff);transform:translateX(2%)}100%{filter:none}}
#lyr{margin:0;max-width:560px;width:100%;min-height:1.4em;text-align:center;font-size:15px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#full.imm .fh,#full.imm .sk,#full.imm .ct,#full.imm .vl,#full.imm .ft>button{opacity:0;pointer-events:none}
#full.imm .stage{width:min(90vw,62vh,440px)}#full.imm #bgm::after{background:none}
.sel .cb{display:none}.card.sl .art{outline:3px solid var(--ac);outline-offset:-3px}
</style></head>
<body>
<div class="top"><div class="hd"><h1>Mi música</h1><button class="btn m" id="add">+ Añadir</button></div>
<div class="tabs"><button class="tab" data-v="songs">Canciones</button><button class="tab" data-v="lists">Listas</button><button class="tab" data-v="favs">Favoritas</button><button class="tab" data-v="set">Ajustes</button></div></div>
<div id="main"></div><div class="menu" id="menu" hidden></div>
<div id="mini" hidden><div id="mart"></div><div id="mn"></div><button class="ib" id="mpp" aria-label="Reproducir">▶</button><button class="ib" id="mnx" aria-label="Siguiente">⏭</button></div>

<section id="full" aria-label="Reproduciendo"><div id="bgm"></div>
 <div class="fh"><button class="ib" id="fclose" aria-label="Cerrar">⌄</button><div><small>Reproduciendo desde</small><b id="from">Canciones</b></div><button class="ib" id="fmore" aria-label="Personalizar">⋮</button></div>
 <div class="stage" id="stage"><canvas class="viz" id="viz"></canvas><svg class="ring" viewBox="0 0 100 100"><path class="rt" id="rt" d="M50 2A48 48 0 0 1 50 98A48 48 0 0 1 50 2"/><path class="rp" id="rp" pathLength="100" d="M50 2A48 48 0 0 1 50 98A48 48 0 0 1 50 2"/></svg><div class="disc" id="disc" data-s="vinyl" data-sh="circle"><div class="cv" id="cv"></div></div></div>
 <div class="ft"><button class="ib" id="fav" aria-label="Favorita">♡</button><div><p id="ft">Nada sonando</p><small id="fs"></small></div><button class="ib" id="fq" aria-label="Cola">≡</button></div><p id="lyr"></p>
 <div class="sk"><span id="cu">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición"><span id="du">0:00</span></div>
 <div class="ct"><button class="ib" id="shuf" aria-label="Aleatorio">⇄</button><button class="ib" id="prev" aria-label="Anterior">⏮</button><button class="ib pp" id="pp" aria-label="Reproducir">▶</button><button class="ib" id="next" aria-label="Siguiente">⏭</button><button class="ib" id="rep" aria-label="Repetir">↻</button></div>
 <div class="vl"><span>Vol</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volumen"></div>
 <div class="sheet" id="cust">
  <b>Personalizar esta canción</b>
  <label class="r">Nombre <input class="in" id="cn"></label>
  <label class="r">Color <input type="range" id="ch" min="0" max="360"></label>
  <label class="r">Estilo <select class="sel" id="cs"><option value="vinyl">Vinilo</option><option value="rings">Anillos</option><option value="solid">Sólido</option><option value="glass">Cristal</option><option value="aurora">Aurora</option><option value="custom">Mis colores</option></select></label>
  <div class="r"><span>Colores (mezcla)</span><span><input type="color" id="k0" aria-label="Color 1"><input type="color" id="k1" aria-label="Color 2"><input type="color" id="k2" aria-label="Color 3"></span></div>
  <label class="r">Degradado <select class="sel" id="cg"><option value="linear">Lineal</option><option value="radial">Radial</option><option value="conic">Cónico</option><option value="solid">Un solo color</option></select></label>
  <label class="r">Movimiento del disco <select class="sel" id="cm"><option value="spin">Girar</option><option value="none">Quieto</option><option value="sway">Balanceo</option><option value="float">Flotar</option></select></label>
  <label class="r">Velocidad <select class="sel" id="cp"><option value="14">Lenta</option><option value="8">Normal</option><option value="4">Rápida</option></select></label>
  <label class="r">Efecto con el sonido <select class="sel" id="cz"><option value="wave">Ondas (anillo)</option><option value="bars">Barras</option><option value="vapor">Vapor</option><option value="sparks">Chispas</option><option value="snow">Nieve</option><option value="off">Ninguno</option></select></label>
  <label class="r">Fondo <select class="sel" id="cb"><option value="auto">Automático</option><option value="grad">Degradado con mis colores</option><option value="media">Imagen o video</option><option value="black">Negro</option></select></label>
  <div class="r"><button class="btn" id="bimg">Fondo: imagen o video</button><button class="btn" id="bdel">Quitar fondo</button></div>
  <input type="file" id="bfile" accept="image/*,video/*" hidden>
  <label class="r">Efecto de audio <select class="sel" id="cx"><option value="">Normal</option><option value="slow">Slowed + reverb</option><option value="fast">Sped up (nightcore)</option><option value="rev">Solo reverb</option></select></label>
  <label class="r">Ecualizador <select class="sel" id="cq"></select></label>
  <label class="r">Efecto al ritmo <select class="sel" id="ce"><option value="">Ninguno</option><option value="shake">Sacudida</option><option value="flash">Destello</option><option value="glitch">Glitch de color</option></select></label>
  <div class="r"><span>Repetir fragmento</span><span><button class="btn" id="la">Inicio</button> <button class="btn" id="lb">Fin</button> <button class="btn" id="lx">Quitar</button></span></div>
  <div class="r"><button class="btn" id="lbtn">Cargar letra (.lrc)</button><button class="btn" id="ldel">Quitar letra</button></div><input type="file" id="lfile" accept=".lrc,.txt,text/*" hidden>
  <div class="r"><button class="btn" id="timg">Miniatura de biblioteca</button><button class="btn" id="tdel">Quitar</button></div><input type="file" id="tfile" accept="image/*" hidden>
  <div class="r"><b>Plantillas de estilo</b></div>
  <div class="r"><input class="in" id="tn" placeholder="Nombre de plantilla"><button class="btn" id="tsv">Guardar</button></div>
  <div class="r"><select class="sel" id="tsel"></select><button class="btn" id="tap">Aplicar</button><button class="btn" id="tall">A todas</button><button class="btn" id="tdl">Borrar</button></div>
  <div class="r"><button class="btn" id="imm">Modo edit (pantalla completa)</button></div>
  <label class="r">Forma <select class="sel" id="csh"><option value="circle">Círculo (gira)</option><option value="squircle">Cuadrado suave</option><option value="hexagon">Hexágono</option><option value="diamond">Rombo</option></select></label>
  <label class="r">Reacción a los graves <select class="sel" id="cr"><option value="0">Sin movimiento</option><option value="1">Suave</option><option value="2">Fuerte</option></select></label>
  <label class="r"><span>Colorear toda la app</span><input type="checkbox" id="cac"></label>
  <div class="r"><button class="btn" id="cimg">Portada: imagen o video</button><button class="btn" id="cdel">Quitar</button><button class="btn" id="crst">Restablecer</button></div>
  <input type="file" id="cfile" accept="image/*,video/*" hidden>
 </div>
<div class="sheet" id="qs"><b>Cola de reproducción</b><div id="ql"></div></div><div id="fl"></div></section>
<input type="file" id="file" accept="audio/*" multiple hidden>

<script>
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const A=new Audio();A.volume=.8;
let tracks=[],by={},cur=null,ids=[],shuf=false,rep=0,view='songs',open=null,sortM='add',lists={},favs=new Set(),meta={},eqv=[0,0,0,0,0],db,cov={},ctx,filt=[],an,fd,stopEnd=false,sleepT,raf=0,q='',from='Canciones';
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim();
const fmt=t=>{if(!isFinite(t))return'0:00';const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=String(Math.floor(t%60)).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+s:m+':'+s};
const nm=t=>(meta[t.id]||{}).n||t.name,hu=t=>(meta[t.id]||{}).h??hash(t.name),mm=t=>meta[t.id]||(meta[t.id]={});
const sv=()=>{try{localStorage.setItem('mm-prefs',JSON.stringify({favs:[...favs],lists,tpl,plays,rec,fade,eq:eqv,sort:sortM,spd:gspd,shuffle:shuf,repeat:rep,theme:document.documentElement.dataset.theme||''}));localStorage.setItem('mm-meta',JSON.stringify(meta))}catch(e){}};

/* Almacenamiento (IndexedDB): t = canciones, c = portadas */
const idb=()=>new Promise(r=>{try{const o=indexedDB.open('mi-musica',2);o.onupgradeneeded=()=>{const d=o.result;['t','c'].forEach(n=>d.objectStoreNames.contains(n)||d.createObjectStore(n,{keyPath:'id'}))};o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r()}catch(e){r()}});
const os=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const all=s=>new Promise(r=>{try{const g=os(s).getAll();g.onsuccess=()=>r(g.result||[]);g.onerror=()=>r([])}catch(e){r([])}});
const put=(s,o)=>{try{os(s,'readwrite').put(o)}catch(e){}},del=(s,id)=>{try{os(s,'readwrite').delete(id)}catch(e){}};

/* Elementos visuales */
function media(t,small){return mk(cov[t.id],small)}
function mk(c,small){if(!c)return null;if(c.type==='video'&&small)return null;const v=c.type==='video',e=document.createElement(v?'video':'img');e.src=c.url+(v&&small?'#t=0.1':'');if(v){e.muted=true;e.loop=true;e.playsInline=true;if(small)e.preload='metadata';else e.autoplay=true}else e.alt='';return e}
function art(t){const d=el('div','art');d.style.setProperty('--h',hu(t));const m=media(t,true)||(cov['th-'+t.id]?mk(cov['th-'+t.id],true):null);if(m)d.appendChild(m);else d.textContent='♪';return d}
const shown=()=>tracks.filter(t=>(view==='favs'?favs.has(t.id):view==='lists'&&open?(lists[open]||[]).includes(t.id):true)&&(!q||nm(t).toLowerCase().includes(q)));
const cmp={top:(a,b)=>(plays[b.id]||0)-(plays[a.id]||0),rec:(a,b)=>(rec[b.id]||0)-(rec[a.id]||0),add:(a,b)=>parseInt(a.id)-parseInt(b.id),az:(a,b)=>nm(a).localeCompare(nm(b),'es'),za:(a,b)=>nm(b).localeCompare(nm(a),'es')};

function card(t){const c=el('div','card'+(t.id===cur?' cur':'')+(selS.has(t.id)?' sl':''));c.dataset.id=t.id;c.appendChild(art(t));const n=el('div','cn');n.textContent=nm(t);c.appendChild(n);
  const f=favs.has(t.id);c.appendChild(el('div','cb',"<button class='fv"+(f?' on':'')+"' aria-label='Favorita'>"+(f?'♥':'♡')+"</button><button class='pl' aria-label='Añadir a lista'>＋</button><button class='rm' aria-label='Quitar'>✕</button>"));
  c.onclick=e=>{if(sel){selS.has(t.id)?selS.delete(t.id):selS.add(t.id);c.classList.toggle('sl',selS.has(t.id));selCount();return}const x=e.target.closest('button');if(!x)return play(t.id,shown().map(s=>s.id),true);
    if(x.classList.contains('fv')){favs.has(t.id)?favs.delete(t.id):favs.add(t.id);sv();drawGrid();favUI()}
    else if(x.classList.contains('pl'))menu(t.id,x);
    else if(view==='lists'&&open){lists[open]=lists[open].filter(i=>i!==t.id);sv();drawGrid()}
    else if(confirm('¿Quitar esta canción de tu biblioteca?'))rm(t)};
  return c}

$('#crst').onclick=()=>{const t=by[cur];if(!t)return;delete meta[t.id];delete cov[cur];del('c',cur);delete cov['bg-'+cur];del('c','bg-'+cur);delete cov['th-'+cur];del('c','th-'+cur);sv();skin(true);drawGrid()};

/* Colores, movimiento, efecto y fondo */
['k0','k1','k2'].forEach(i=>$('#'+i).oninput=()=>{const t=by[cur];if(!t)return;const m=mm(t);m.k=[$('#k0').value,$('#k1').value,$('#k2').value];if(m.s!=='custom'){m.s='custom';$('#cs').value='custom'}sv();skin(false)});
$('#cg').onchange=e=>setM('g',e.target.value==='linear'?'':e.target.value);
$('#cm').onchange=e=>setM('mo',e.target.value==='spin'?'':e.target.value);
$('#cp').onchange=e=>setM('sp',e.target.value==='8'?'':+e.target.value);
$('#cz').onchange=e=>setM('z',e.target.value==='wave'?'':e.target.value);
$('#cb').onchange=e=>setM('b',e.target.value==='auto'?'':e.target.value);
$('#bimg').onclick=()=>{if(cur)$('#bfile').click()};
$('#bfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;const key='bg-'+cur;if(cov[key])URL.revokeObjectURL(cov[key].url);const type=f.type.startsWith('video')?'video':'image';cov[key]={url:URL.createObjectURL(f),type};put('c',{id:key,blob:f,type});mm(by[cur]).b='media';sv();$('#cb').value='media';skin(false)};
$('#bdel').onclick=()=>{if(!cur)return;const key='bg-'+cur;delete cov[key];del('c',key);delete mm(by[cur]).b;sv();$('#cb').value='auto';skin(false)};

/* Añadir canciones (varias a la vez) */
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=e=>{add(e.target.files);e.target.value=''};
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();add(e.dataTransfer.files)});
function add(files){let first=null;for(const f of files){if(!(f.type.startsWith('audio/')||/\.(mp3|m4a|aac|wav|ogg|opus|flac|wma)$/i.test(f.name)))continue;
  const id=Date.now()+'-'+Math.random().toString(36).slice(2,7),t={id,name:clean(f.name),url:URL.createObjectURL(f)};tracks.push(t);by[id]=t;put('t',{id,name:t.name,blob:f});first=first||t}
  if(view!=='songs'){view='songs';open=null}render();
  if(!cur&&first){ids=tracks.map(x=>x.id);cur=first.id;A.src=first.url;skin(true)}}

/* Posición guardada y copia de seguridad */
let pos={},lastSave=0;
function savePos(f){if(!cur||!A.duration||A.duration<600||A.currentTime<5)return;if(!f&&Date.now()-lastSave<5000)return;lastSave=Date.now();pos[cur]=A.currentTime;try{localStorage.setItem('mm-pos',JSON.stringify(pos))}catch(e){}}
const bk=t=>{const e=$('#bk');if(e)e.textContent=t};
const putP=(st,o)=>new Promise(r=>{try{const t=db.transaction(st,'readwrite');t.objectStore(st).put(o);t.oncomplete=t.onerror=t.onabort=()=>r()}catch(e){r()}});
async function exportAll(){try{bk('Preparando copia…');const items=[],parts=[],tr=await all('t'),cv=await all('c');
  tr.forEach(o=>{items.push({s:'t',id:o.id,name:o.name,mime:o.blob.type,size:o.blob.size});parts.push(o.blob)});
  cv.forEach(o=>{items.push({s:'c',id:o.id,ct:o.type,mime:o.blob.type,size:o.blob.size});parts.push(o.blob)});
  const enc=new TextEncoder(),head=enc.encode(JSON.stringify({v:1,items,prefs:localStorage.getItem('mm-prefs'),meta:localStorage.getItem('mm-meta'),pos:localStorage.getItem('mm-pos')})),len=new Uint8Array(4);new DataView(len.buffer).setUint32(0,head.length);
  const blob=new Blob([enc.encode('MMBK1'),len,head,...parts]),a=el('a');a.href=URL.createObjectURL(blob);a.download='mi-musica-respaldo.mmbk';document.body.appendChild(a);a.click();a.remove();
  bk('Copia lista: '+tr.length+' canciones. Guarda el archivo en un lugar seguro.')}catch(e){bk('No se pudo crear la copia (poca memoria o espacio).')}}
async function importAll(f){if(!f)return;try{if(await f.slice(0,5).text()!=='MMBK1')return bk('Ese archivo no es una copia válida.');
  const hl=new DataView(await f.slice(5,9).arrayBuffer()).getUint32(0),h=JSON.parse(await f.slice(9,9+hl).text());let off=9+hl,n=0;
  for(const it of h.items){const b=f.slice(off,off+it.size,it.mime||'');off+=it.size;await putP(it.s,it.s==='t'?{id:it.id,name:it.name,blob:b}:{id:it.id,blob:b,type:it.ct});bk('Importando '+(++n)+' de '+h.items.length+'…')}
  if(h.prefs)localStorage.setItem('mm-prefs',h.prefs);if(h.meta)localStorage.setItem('mm-meta',h.meta);if(h.pos)localStorage.setItem('mm-pos',h.pos);
  bk('Listo. Recargando…');setTimeout(()=>location.reload(),600)}catch(e){bk('No se pudo importar la copia.')}}

/* Iconos, forma del anillo, miniaturas de video y color de la barra del sistema */
const svg=(p,z)=>"<svg width='"+z+"' height='"+z+"' viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'>"+p+"</svg>";
const PLAY=svg("<path d='M8 5v14l11-7z'/>",30),PAUSE=svg("<path d='M6 5h4v14H6zM14 5h4v14h-4z'/>",30);
$('#fclose').innerHTML="<svg width='26' height='26' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M6 9l6 6 6-6'/></svg>";
$('#fmore').innerHTML=svg("<circle cx='12' cy='5' r='2'/><circle cx='12' cy='12' r='2'/><circle cx='12' cy='19' r='2'/>",24);
const RING={circle:'M50 2A48 48 0 0 1 50 98A48 48 0 0 1 50 2',squircle:'M50 3H71A26 26 0 0 1 97 29V71A26 26 0 0 1 71 97H29A26 26 0 0 1 3 71V29A26 26 0 0 1 29 3Z',hexagon:'M50 6L73 6L98 50L73 94L27 94L2 50L27 6Z',diamond:'M50 2L98 50L50 98L2 50Z'};
function tc(){const m=document.querySelector('meta[name=theme-color]');if(m)m.content=$('#full').classList.contains('open')?'#0a0d15':(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#0e121c')}
new MutationObserver(tc).observe($('#full'),{attributes:true,attributeFilter:['class']});

/* Efectos de audio, ritmo, plantillas, selección, cola y letras */
let gspd=1,tpl={},plays={},rec={},fade=0,sel=false,selS=new Set(),loopA=null,loopB=null,avgB=0,lastBeat=0,vm='',ly=[],li=-2,out,conv,wet;
const PRE={'Plano':[0,0,0,0,0],'Más graves':[7,4,0,0,0],'Voces':[-2,0,4,3,0],'Más agudos':[0,0,0,4,7],'Rock':[5,3,-2,3,5],'Pop':[-1,3,4,2,-1]};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function impulse(c){const r=c.sampleRate,l=r*2.6|0,b=c.createBuffer(2,l,r);for(let h=0;h<2;h++){const d=b.getChannelData(h);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,2.6)}return b}
function applyFx(){const m=meta[cur]||{},f=m.fx||'',r=({slow:.85,fast:1.25}[f]||1)*gspd;A.defaultPlaybackRate=A.playbackRate=r;A.preservesPitch=!f;A.mozPreservesPitch=!f;A.webkitPreservesPitch=!f;
  if(wet)wet.gain.value=(f==='slow'||f==='rev')?.55:0;const g=PRE[m.q]||eqv;filt.forEach((x,i)=>x.gain.value=g[i])}
function tick2(){const t=A.currentTime,d=A.duration;if(out&&d){const g=fade?Math.max(0,Math.min(1,t/fade,(d-t)/fade)):1;out.gain.setTargetAtTime(g,ctx.currentTime,.12)}
  if(loopA!=null&&loopB!=null&&t>=loopB)A.currentTime=loopA;lyr(t)}
function beatCheck(l){avgB=avgB*.94+l*.06;const now=performance.now();if(l>.4&&l>avgB*1.25&&now-lastBeat>200){lastBeat=now;const b=(meta[cur]||{}).be;if(!b)return;const st=$('#stage');
  if(b==='flash'){const f=$('#fl');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
  else{const c=b==='shake'?'bs':'bg2';st.classList.remove('bs','bg2');void st.offsetWidth;st.classList.add(c);setTimeout(()=>st.classList.remove(c),260)}}}
const parseLy=x=>x.split(/\r?\n/).map(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);return m?[+m[1]*60+ +m[2],m[3].trim()]:null}).filter(Boolean).sort((a,b)=>a[0]-b[0]);
function lyr(t){if(!ly.length)return;let i=-1;for(let k=0;k<ly.length;k++){if(ly[k][0]<=t)i=k;else break}if(i!==li){li=i;$('#lyr').textContent=i>=0?ly[i][1]:''}}
$('#fq').innerHTML=svg("<path d='M3 6h13v2H3zM3 11h13v2H3zM3 16h8v2H3zM18 12v6.5a2.5 2.5 0 1 1-2-2.4V12z'/>",24);
$('#cq').innerHTML='<option value="">General</option>'+Object.keys(PRE).map(k=>'<option>'+k+'</option>').join('');
$('#cx').onchange=e=>setM('fx',e.target.value);$('#cq').onchange=e=>setM('q',e.target.value);$('#ce').onchange=e=>setM('be',e.target.value);
$('#la').onclick=()=>{loopA=A.currentTime;$('#la').textContent='Inicio '+fmt(loopA)};
$('#lb').onclick=()=>{if(loopA==null||A.currentTime<=loopA)return;loopB=A.currentTime;$('#lb').textContent='Fin '+fmt(loopB)};
$('#lx').onclick=()=>{loopA=loopB=null;$('#la').textContent='Inicio';$('#lb').textContent='Fin'};
$('#lbtn').onclick=()=>{if(cur)$('#lfile').click()};
$('#lfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;const x=await f.text();mm(by[cur]).ly=x;sv();ly=parseLy(x);li=-2;$('#lyr').textContent=ly.length?'':'(esa letra no trae tiempos; usa un archivo .lrc)'};
$('#ldel').onclick=()=>{if(!cur)return;delete mm(by[cur]).ly;sv();ly=[];li=-2;$('#lyr').textContent=''};
$('#timg').onclick=()=>{if(cur)$('#tfile').click()};
$('#tfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;const key='th-'+cur;if(cov[key])URL.revokeObjectURL(cov[key].url);cov[key]={url:URL.createObjectURL(f),type:'image'};put('c',{id:key,blob:f,type:'image'});drawGrid();mini()};
$('#tdel').onclick=()=>{if(!cur)return;const key='th-'+cur;delete cov[key];del('c',key);drawGrid();mini()};
$('#imm').onclick=e=>{e.stopPropagation();$('#cust').classList.remove('open');$('#full').classList.add('imm')};
$('#full').addEventListener('click',()=>$('#full').classList.remove('imm'));
/* Plantillas */
const KEYS=['s','sh','h','k','g','mo','sp','z','r','a','be','fx','q'];
function fillTpl(){$('#tsel').innerHTML=Object.keys(tpl).map(n=>'<option>'+esc(n)+'</option>').join('')}
const tpick=m=>{const o={};KEYS.forEach(k=>{if(m[k]!==undefined)o[k]=m[k]});if(m.b&&m.b!=='media')o.b=m.b;return o};
function applyTpl(id,n){const t=by[id];if(!t||!tpl[n])return;const m=mm(t);KEYS.forEach(k=>delete m[k]);Object.assign(m,JSON.parse(JSON.stringify(tpl[n])))}
$('#tsv').onclick=()=>{const n=$('#tn').value.trim(),t=by[cur];if(!n||!t)return;tpl[n]=tpick(meta[t.id]||{});$('#tn').value='';sv();fillTpl();$('#tsel').value=n};
$('#tap').onclick=()=>{const n=$('#tsel').value;if(!n||!cur)return;applyTpl(cur,n);sv();skin(true);drawGrid()};
$('#tall').onclick=()=>{const n=$('#tsel').value;if(!n||!tracks.length||!confirm('¿Aplicar este estilo a todas las canciones?'))return;tracks.forEach(t=>applyTpl(t.id,n));sv();skin(true);drawGrid()};
$('#tdl').onclick=()=>{const n=$('#tsel').value;if(!n)return;delete tpl[n];sv();fillTpl()};
/* Selección múltiple */
const selCount=()=>{const e=$('#sn');if(e)e.textContent=selS.size+' seleccionadas'};
function endSel(){sel=false;selS.clear();render()}
function selBar(){const d=el('div','bar'),i=el('span');i.id='sn';d.appendChild(i);const bt=(t,f)=>{const b=el('button','btn',t);b.onclick=f;d.appendChild(b)};
  bt('Todas',()=>{shown().forEach(t=>selS.add(t.id));drawGrid();selCount()});
  bt('♥ Favoritas',()=>{selS.forEach(x=>favs.add(x));sv();endSel()});
  const ls=el('select','sel');ls.innerHTML=Object.keys(lists).map(n=>'<option>'+esc(n)+'</option>').join('')||'<option value="">(sin listas)</option>';d.appendChild(ls);
  bt('A la lista',()=>{const n=ls.value;if(n){selS.forEach(x=>{if(!lists[n].includes(x))lists[n].push(x)});sv();endSel()}});
  const ts=el('select','sel');ts.innerHTML=Object.keys(tpl).map(n=>'<option>'+esc(n)+'</option>').join('')||'<option value="">(sin plantillas)</option>';d.appendChild(ts);
  bt('Aplicar estilo',()=>{if(tpl[ts.value]){selS.forEach(x=>applyTpl(x,ts.value));sv();endSel()}});
  bt('Borrar',()=>{if(selS.size&&confirm('¿Quitar '+selS.size+' canciones de tu biblioteca?')){[...selS].forEach(x=>by[x]&&rm(by[x]));endSel()}});
  selCount();return d}
/* Cola */
function drawQ(){const l=$('#ql');l.innerHTML='';ids.forEach((id,i)=>{const t=by[id];if(!t)return;const r=el('div','r'),n=el('span');n.textContent=(id===cur?'● ':'')+nm(t);n.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer';n.onclick=()=>play(id);r.appendChild(n);
  const mv=d=>{const j=i+d;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];drawQ();skin(false)};
  [['▲',()=>mv(-1)],['▼',()=>mv(1)],['✕',()=>{ids.splice(i,1);drawQ()}]].forEach(([c,f])=>{const b=el('button','btn',c);b.onclick=f;r.appendChild(b)});l.appendChild(r)})}
$('#fq').onclick=()=>{$('#cust').classList.remove('open');$('#qs').classList.toggle('open');drawQ()};
$('#fmore').addEventListener('click',()=>$('#qs').classList.remove('open'));

/* Inicio */
(async()=>{
  try{const p=JSON.parse(localStorage.getItem('mm-prefs')||'{}');if(p.theme)document.documentElement.dataset.theme=p.theme;favs=new Set(p.favs||[]);lists=p.lists||{};tpl=p.tpl||{};plays=p.plays||{};rec=p.rec||{};fade=p.fade||0;eqv=p.eq||eqv;sortM=p.sort||'add';shuf=!!p.shuffle;rep=p.repeat||0;
    if(p.spd){gspd=p.spd;A.defaultPlaybackRate=A.playbackRate=p.spd}$('#shuf').classList.toggle('on',shuf);$('#rep').classList.toggle('on',rep>0);$('#rep').textContent=rep===2?'↻1':'↻';
    meta=JSON.parse(localStorage.getItem('mm-meta')||'{}')}catch(e){}
  try{pos=JSON.parse(localStorage.getItem('mm-pos')||'{}')}catch(e){}
  await idb();
  (await all('t')).forEach(o=>{const t={id:o.id,name:o.name,url:URL.createObjectURL(o.blob)};tracks.push(t);by[t.id]=t});
  (await all('c')).forEach(o=>{cov[o.id]={url:URL.createObjectURL(o.blob),type:o.type}});
  render();
  ui();tc();fillTpl();
  try{const l=localStorage.getItem('mm-last');if(l&&by[l]){ids=tracks.map(x=>x.id);cur=l;A.src=by[l].url;skin(true)}}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body></html>
