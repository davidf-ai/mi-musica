<script>
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const A=new Audio();A.volume=.8;
let tracks=[],by={},cur=null,ids=[],shuf=false,rep=0,view='songs',open=null,sortM='add',lists={},favs=new Set(),meta={},eqv=[0,0,0,0,0],db,cov={},ctx,filt=[],an,fd,stopEnd=false,sleepT,raf=0,q='',from='Canciones';
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim();
const fmt=t=>{if(!isFinite(t))return'0:00';const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=String(Math.floor(t%60)).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+s:m+':'+s};
const nm=t=>(meta[t.id]||{}).n||t.name,hu=t=>(meta[t.id]||{}).h??hash(t.name),mm=t=>meta[t.id]||(meta[t.id]={});
const sv=()=>{try{localStorage.setItem('mm-prefs',JSON.stringify({favs:[...favs],favT,lists,lic,tpl,plays,rec,fade,eq:eqv,sort:sortM,spd:gspd,shuffle:shuf,repeat:rep,theme:document.documentElement.dataset.theme||''}));localStorage.setItem('mm-meta',JSON.stringify(meta))}catch(e){}};

/* Almacenamiento (IndexedDB): t = canciones, c = portadas */
const idb=()=>new Promise(r=>{try{const o=indexedDB.open('mi-musica',2);o.onupgradeneeded=()=>{const d=o.result;['t','c'].forEach(n=>d.objectStoreNames.contains(n)||d.createObjectStore(n,{keyPath:'id'}))};o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r()}catch(e){r()}});
const os=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const all=s=>new Promise(r=>{try{const g=os(s).getAll();g.onsuccess=()=>r(g.result||[]);g.onerror=()=>r([])}catch(e){r([])}});
const put=(s,o)=>{try{os(s,'readwrite').put(o)}catch(e){}},del=(s,id)=>{try{os(s,'readwrite').delete(id)}catch(e){}};

/* Elementos visuales */
function media(t,small){return mk(cov[t.id],small)}
function mk(c,small){if(!c)return null;if(c.type==='video'&&small)return null;const v=c.type==='video',e=document.createElement(v?'video':'img');e.src=c.url+(v&&small?'#t=0.1':'');if(v){e.muted=true;e.loop=true;e.playsInline=true;if(small)e.preload='metadata';else e.autoplay=true}else e.alt='';return e}
function art(t){const d=el('div','art');d.style.setProperty('--h',hu(t));const m=media(t,true)||(cov['th-'+t.id]?mk(cov['th-'+t.id],true):null);if(m)d.appendChild(m);else d.textContent='♪';return d}
const shown=()=>tracks.filter(t=>(view==='favs'?favs.has(t.id):view==='lists'&&open?(lists[open]||[]).includes(t.id):true)&&(!q||nm(t).toLowerCase().includes(q))&&(!dupOnly||dupIds.has(t.id)));
const cmp={top:(a,b)=>(plays[b.id]||0)-(plays[a.id]||0),rec:(a,b)=>(rec[b.id]||0)-(rec[a.id]||0),add:(a,b)=>parseInt(a.id)-parseInt(b.id),az:(a,b)=>nm(a).localeCompare(nm(b),'es'),za:(a,b)=>nm(b).localeCompare(nm(a),'es')};

function card(t){const c=el('div','card'+(t.id===cur?' cur':'')+(selS.has(t.id)?' sl':''));c.dataset.id=t.id;{const a=art(t);a.appendChild(el('span','eqb','<i></i><i></i><i></i>'));c.appendChild(a)}if(dupIds.has(t.id))c.appendChild(el('span','bdg','Duplicada'));const n=el('div','cn');n.textContent=nm(t);c.appendChild(n);
  const f=favs.has(t.id);c.appendChild(el('div','cb',"<button class='fv"+(f?' on':'')+"' aria-label='Favorita'>"+HEART+"</button><button class='pl' aria-label='Más opciones'>"+MORE+"</button>"));
  c.onclick=e=>{if(sel){selS.has(t.id)?selS.delete(t.id):selS.add(t.id);c.classList.toggle('sl',selS.has(t.id));selCount();return}const x=e.target.closest('button');if(!x)return play(t.id,shown().map(s=>s.id),true);
    if(x.classList.contains('fv')){toggleFav(t.id,x)}
    else if(x.classList.contains('pl'))menu(t.id,x);
    else if(view==='lists'&&open){lists[open]=lists[open].filter(i=>i!==t.id);sv();drawGrid()}
    else if(confirm('¿Quitar esta canción de tu biblioteca?'))rm(t)};
  return c}
function rm(t){del('t',t.id);del('c',t.id);del('c','bg-'+t.id);del('c','th-'+t.id);favs.delete(t.id);delete meta[t.id];for(const k in lists)lists[k]=lists[k].filter(x=>x!==t.id);
  tracks=tracks.filter(x=>x!==t);delete by[t.id];ids=ids.filter(x=>x!==t.id);if(cur===t.id){A.pause();A.removeAttribute('src');cur=null;skin(true)}sv();drawGrid();mini()}
function drawGrid(){const g=$('#grid');if(!g)return;calcDups();sortT();g.innerHTML='';const l=shown();if(view==='lists'&&open)return listRows(g,l);if(view==='favs')l.sort(favCmp);if(dupOnly)l.sort((x,y)=>nk(x.name).localeCompare(nk(y.name)));
  if(!l.length){g.className='';g.innerHTML=tracks.length?(view==='favs'?"<div class='empty'><div class='bigh'>"+HEART+"</div><b>Aún no tienes favoritas</b>Toca el corazón de una canción para guardarla aquí.</div>":"<div class='empty'>Nada por aquí todavía.</div>"):"<div class='empty'><b>Tu biblioteca está vacía</b>Pulsa “+ Añadir” y elige varias canciones de tu celular a la vez.</div>";return}
  g.className=vmode==='list'?'rows':'grid';l.forEach(t=>g.appendChild(card(t)));const c=$('#cnt');if(c)c.textContent=l.length+' canciones'}
const sortT=()=>tracks.sort(cmp[sortM]||cmp.add);

function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===view));badges();const m=$('#main');m.innerHTML='';m.classList.toggle('sel',sel);
  if(view==='set')return settings(m);
  if(view==='lists'&&!open){const b=el('div','bar',"<input class='in' id='nl' placeholder='Nueva lista' aria-label='Nombre de la lista'><button class='btn m' id='mk'>Crear</button>");m.appendChild(b);
    b.querySelector('#mk').onclick=()=>{const n=$('#nl').value.trim();if(n&&!lists[n]){lists[n]=[];sv();render()}};
    const ks=Object.keys(lists);if(!ks.length)m.appendChild(el('div','empty',"<b>Sin listas</b>Crea una y añade canciones con el botón ＋ de cada tarjeta."));
    ks.forEach(n=>m.appendChild(listCard(n)));return}
  const b=el('div','bar');if(view==='favs')m.appendChild(favHero());
  if(view==='lists'){const bk=el('button','btn','← Listas');bk.onclick=()=>{open=null;q='';render()};const t=el('b');t.textContent=open;const d=el('button','btn','Borrar lista');d.onclick=()=>{if(confirm('¿Borrar esta lista?')){delete lists[open];open=null;sv();render()}};b.append(bk,t,d);m.appendChild(b);}
  const b2=el('div','bar',"<input class='in' id='sq' type='search' placeholder='Buscar' aria-label='Buscar'><span id='cnt'></span>");b2.firstChild.value=q;b2.firstChild.oninput=e=>{q=e.target.value.toLowerCase();drawGrid()};
  if(view==='songs'){const s=el('select','sel',"<option value='add'>Añadidas</option><option value='az'>A–Z</option><option value='za'>Z–A</option><option value='top'>Más escuchadas</option><option value='rec'>Recientes</option>");s.value=sortM;s.onchange=e=>{sortM=e.target.value;sv();drawGrid()};b2.appendChild(s)}
  const sb=el('button','btn',sel?'Cancelar':'Seleccionar');sb.onclick=()=>{sel=!sel;selS.clear();render()};b2.appendChild(sb);b2.appendChild(pAll());if(view!=='lists')b2.appendChild(vtog());calcDups();if(dupIds.size||dupOnly){const db=el('button','btn',dupOnly?'Ver todas':'Duplicadas ('+dupIds.size+')');db.onclick=()=>{dupOnly=!dupOnly;render()};b2.appendChild(db)}m.appendChild(b2);if(sel)m.appendChild(selBar());m.appendChild(el('div','','')).id='grid';drawGrid()}

function settings(m){
  m.innerHTML="<h3>Modo simple</h3><label style='display:block;margin:8px 0'><input type='checkbox' id='simp'> <b>Modo simple (bajo rendimiento)</b></label><p style='color:var(--mu);margin:0 0 8px'>Apaga los efectos de pantalla, filtros, texturas, videos y animaciones. Úsalo si el celular se calienta, se traba o gasta mucha batería.</p><h3>Apariencia</h3><button class='btn' id='th'>Cambiar claro / oscuro</button><h3>Reproducción</h3><div class='bar'><label>Velocidad <select class='sel' id='spd'><option value='0.75'>0.75x</option><option value='1'>1x</option><option value='1.25'>1.25x</option><option value='1.5'>1.5x</option><option value='2'>2x</option></select></label><label>Apagar en <select class='sel' id='sl'><option value='0'>No</option><option value='15'>15 min</option><option value='30'>30 min</option><option value='45'>45 min</option><option value='60'>60 min</option><option value='end'>Al terminar la canción</option></select></label><label>Fundido <select class='sel' id='fd'><option value='0'>No</option><option value='2'>2 s</option><option value='4'>4 s</option><option value='6'>6 s</option></select></label></div><h3>Rendimiento</h3><div class='bar'><select class='sel' id='pf'><option value='auto'>Automático (recomendado)</option><option value='high'>Calidad máxima</option><option value='low'>Ahorro de batería</option><option value='simple'>Modo simple (bajo rendimiento)</option></select></div><p style='color:var(--mu)'>Automático baja los efectos solo si el celular se atasca.</p><h3>Ecualizador</h3><select class='sel' id='pre'></select><div id='eqb'></div><h3>Estilo</h3><div class='bar'><label>Transición entre canciones <select class='sel' id='trs'><option value=''>Deslizar</option><option value='fade'>Desvanecer</option><option value='zoom'>Zoom</option><option value='none'>Ninguna</option></select></label></div><label style='display:block;margin:8px 0'><input type='checkbox' id='tilt'> Inclinar el celular mueve el fondo</label><label style='display:block;margin:8px 0'><input type='checkbox' id='hap'> Vibrar con el ritmo (si el celular lo permite)</label><h3>Efectos de audio</h3><div class='bar'><select class='sel' id='gfx'></select><button class='btn' id='gfa'>Aplicar a todas</button></div><label style='display:block;margin:8px 0'><input type='checkbox' id='nm'> Igualar volumen entre canciones (compresor)</label><h3>Organizar</h3><div class='bar'><button class='btn' id='rd'>Quitar copias exactas</button><button class='btn' id='aa'>Estilo automático para todas</button><button class='btn' id='sa'>Sorpresa para todas</button></div><label style='display:block;margin:8px 0'><input type='checkbox' id='ac'> Aplicar Auto cuando pongo una portada</label><p id='dm' style='color:var(--mu)'></p><h3>Copia de seguridad</h3><div class='bar'><button class='btn' id='ex'>Exportar copia</button><button class='btn' id='im'>Importar copia</button><select class='sel' id='ipol'><option value='mine'>Si ya existe: conservar la mía</option><option value='copy'>Si ya existe: usar la de la copia</option><option value='both'>Si ya existe: conservar las dos</option></select></div><p id='bk' style='color:var(--mu)'>Guarda canciones, portadas, listas y estilos en un solo archivo. Con muchas canciones puede tardar y pesar bastante.</p><input type='file' id='imf' hidden><h3>Ayuda</h3><p style='color:var(--mu)'>Tus canciones, portadas y ajustes se guardan en este dispositivo y funcionan sin conexión. No borres los datos del sitio desde los ajustes del celular o perderás la biblioteca.</p>";
  $('#th').onclick=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dk?'light':'dark';sv();tc()};
  $('#fd').value=String(fade);$('#fd').onchange=e=>{fade=+e.target.value;sv()};calcDups();$('#dm').textContent=dupIds.size?dupIds.size+' canciones con nombre repetido: míralas en Canciones → Duplicadas.':'No hay nombres repetidos.';$('#gfx').innerHTML=$('#cx').innerHTML;$('#gfa').onclick=()=>{const v=$('#gfx').value;if(!tracks.length||!confirm('¿Aplicar este efecto de audio a todas las canciones?'))return;tracks.forEach(t=>{const m=mm(t);if(v)m.fx=v;else delete m.fx});sv();applyFx();toast('Efecto aplicado a '+tracks.length+' canciones')};$('#nm').checked=localStorage.getItem('mm-norm')==='1';$('#nm').onchange=e=>{try{localStorage.setItem('mm-norm',e.target.checked?'1':'0')}catch(x){}applyFx()};$('#ipol').value=localStorage.getItem('mm-ipol')||'mine';$('#ipol').onchange=e=>{try{localStorage.setItem('mm-ipol',e.target.value)}catch(x){}};$('#ac').checked=localStorage.getItem('mm-ac')==='1';$('#ac').onchange=e=>{try{localStorage.setItem('mm-ac',e.target.checked?'1':'0')}catch(x){}};$('#rd').onclick=rmDups;$('#aa').onclick=()=>allStyle(autoStyle);$('#sa').onclick=()=>allStyle(surprise);$('#ex').onclick=exportAll;$('#im').onclick=()=>$('#imf').click();$('#imf').onchange=e=>{importAll(e.target.files[0]);e.target.value=''};$('#spd').value=String(gspd);$('#spd').onchange=e=>{gspd=+e.target.value;applyFx();sv()};
  $('#pf').value=perfM;$('#pf').onchange=e=>setPerf(e.target.value);$('#simp').checked=perfM==='simple';$('#simp').onchange=e=>setPerf(e.target.checked?'simple':(localStorage.getItem('mm-perf-prev')||'auto'));$('#trs').value=localStorage.getItem('mm-tr')||'';$('#trs').onchange=e=>{try{localStorage.setItem('mm-tr',e.target.value)}catch(x){}document.documentElement.dataset.tr=e.target.value};$('#tilt').checked=tiltOn;$('#tilt').onchange=e=>setTilt(e.target.checked);$('#hap').checked=hapt;$('#hap').onchange=e=>{hapt=e.target.checked;try{localStorage.setItem('mm-hapt',hapt?'1':'0')}catch(x){}if(hapt&&navigator.vibrate)navigator.vibrate(40)};
  $('#sl').onchange=e=>{clearTimeout(sleepT);stopEnd=false;const v=e.target.value;if(v==='end')stopEnd=true;else if(+v>0)sleepT=setTimeout(()=>{A.pause()},+v*6e4)};
  const PRE={'Plano':[0,0,0,0,0],'Más graves':[7,4,0,0,0],'Voces':[-2,0,4,3,0],'Más agudos':[0,0,0,4,7],'Rock':[5,3,-2,3,5],'Pop':[-1,3,4,2,-1]},N=['60 Hz','230','910','3.6k','14k'];
  const pre=$('#pre');pre.innerHTML='<option value="">Personalizado</option>'+Object.keys(PRE).map(k=>'<option>'+k+'</option>').join('');pre.value=Object.keys(PRE).find(k=>PRE[k].join()===eqv.join())||'';
  N.forEach((n,i)=>{const l=el('label','',"<input type='range' min='-12' max='12' aria-label='"+n+"'><span>"+n+'</span>'),r=l.firstChild;r.value=eqv[i];r.oninput=()=>{eqv[i]=+r.value;if(filt[i])filt[i].gain.value=eqv[i];pre.value='';sv()};$('#eqb').appendChild(l)});
  pre.onchange=e=>{const p=PRE[e.target.value];if(!p)return;eqv=[...p];filt.forEach((f,i)=>f.gain.value=eqv[i]);document.querySelectorAll('#eqb input').forEach((r,i)=>r.value=eqv[i]);sv()}}

/* Menú ＋ listas */
function menu(id,btn){const m=$('#menu'),ks=Object.keys(lists);m.innerHTML='';[['Reproducir siguiente',()=>{ids=ids.filter(x=>x!==id);ids.splice(ids.indexOf(cur)+1,0,id)}],['Añadir a la cola',()=>{ids=ids.filter(x=>x!==id);ids.push(id)}],['Descargar archivo',()=>dl(by[id])],['Quitar de la biblioteca',()=>{if(confirm('¿Quitar esta canción de tu biblioteca?'))rm(by[id])}]].forEach(([n,f])=>{const b=el('button');b.textContent=n;b.onclick=()=>{f();m.hidden=true};m.appendChild(b)});if(!ks.length){const p=el('p','','Crea una lista en la pestaña Listas para guardar canciones');p.style.cssText='padding:8px;margin:0';m.appendChild(p)}
  ks.forEach(n=>{const b=el('button');b.textContent=n;b.onclick=()=>{if(!lists[n].includes(id))lists[n].push(id);sv();m.hidden=true};m.appendChild(b)});
  const r=btn.getBoundingClientRect();m.style.top=r.bottom+scrollY+'px';m.style.left=Math.max(8,r.right+scrollX-180)+'px';m.hidden=false}
document.addEventListener('click',e=>{if(!e.target.closest('#menu,.pl'))$('#menu').hidden=true});

/* Reproducción */
function play(id,list,openFull){const t=by[id];if(!t)return;if(list)ids=list;from=view==='favs'?'Favoritas':view==='lists'&&open?open:'Canciones';loopA=loopB=null;$('#la').textContent='Inicio';$('#lb').textContent='Fin';plays[id]=(plays[id]||0)+1;rec[id]=Date.now();sv();cur=id;try{localStorage.setItem('mm-last',id)}catch(e){}A.src=t.url;skin(true);if($('#qs').classList.contains('open'))drawQ();A.play().catch(()=>{});if(openFull)$('#full').classList.add('open');
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('cur',c.dataset.id===id))}
function nx(auto){if(!ids.length)return;if(auto&&rep===2)return play(cur);if(shuf&&ids.length>1){let n;do{n=ids[Math.random()*ids.length|0]}while(n===cur);return play(n)}let k=ids.indexOf(cur)+1;if(k>=ids.length){if(rep===1||!auto)k=0;else{A.pause();return}}play(ids[k])}
function pv(){if(A.currentTime>3)A.currentTime=0;else{const k=ids.indexOf(cur);play(ids[k<=0?ids.length-1:k-1])}}
function tg(){if(!cur){const l=shown();if(l.length)play(l[0].id,l.map(x=>x.id));return}A.paused?A.play().catch(()=>{}):A.pause()}

function skin(rebuild){const t=by[cur],r=document.documentElement,d=$('#disc');r.style.removeProperty('--ac');r.style.removeProperty('--ai');
  if(rebuild)$('#cv').innerHTML='';
  if(!t){r.style.setProperty('--hue',225);r.style.setProperty('--c1','#7aa2ff');d.classList.remove('hascv');$('#ft').textContent='Nada sonando';$('#fs').textContent='';document.title='Mi música';mini();return}
