<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Mi música</title>
<style>
:root{--bg:#f1f3f8;--pn:#fff;--ink:#16203a;--mu:#66708a;--ln:#dde2ee;--ac:#2f5bea;--ai:#fff;--hue:225;--c1:#7aa2ff;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e121c;--pn:#171d2c;--ink:#e8ecf8;--mu:#8b95b0;--ln:#27304a;--ac:#7aa2ff;--ai:#0c1226}}
:root[data-theme=dark]{--bg:#0e121c;--pn:#171d2c;--ink:#e8ecf8;--mu:#8b95b0;--ln:#27304a;--ac:#7aa2ff;--ai:#0c1226}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
button,select,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h1{margin:0;font-size:24px}
.btn{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--pn)}.btn.m{background:var(--ac);color:var(--ai);border-color:var(--ac);font-weight:700}
.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--ln);margin-top:8px}
.tab{padding:10px 14px;color:var(--mu);white-space:nowrap;border-bottom:3px solid transparent}.tab.on{color:var(--ink);font-weight:700;border-color:var(--ac)}
#main{padding:14px;max-width:900px;margin:0 auto}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.in,.bar select,.sel{padding:8px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);color:var(--ink)}.in{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{position:relative;cursor:pointer}.card.cur .cn{color:var(--ac);font-weight:700}
.art{aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:42px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 65% 52%),hsl(calc(var(--h) + 60) 65% 42%))}
.art img,.art video{width:100%;height:100%;object-fit:cover}
.cn{margin-top:6px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{position:absolute;top:4px;right:4px;display:flex;gap:2px}
.cb button{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:14px}.cb .on{color:#ff6b6b}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;margin-bottom:8px;border-radius:14px;background:var(--pn);border:1px solid var(--ln);cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:40px 12px}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
h3{margin:18px 0 8px}
.menu{position:absolute;z-index:40;width:180px;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:6px;box-shadow:0 10px 30px -10px #0008}
.menu[hidden]{display:none}.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px}
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:20px;background:var(--pn);border:1px solid var(--ln);box-shadow:0 8px 28px -10px #0006;cursor:pointer}
#mini[hidden]{display:none}#mart{width:44px;flex:none}#mart .art{border-radius:12px;font-size:20px}
#mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:42px;height:42px;border-radius:50%;font-size:18px}
#full{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));color:#fff;background:linear-gradient(hsl(var(--hue) 45% 20%),#090c14 85%);transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility .3s;overflow:hidden}
#full.open{transform:none;visibility:visible}
.fh{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:center}.fh small{display:block;opacity:.65;letter-spacing:.08em}
.stage{position:relative;width:min(62vw,42vh,320px);aspect-ratio:1;margin:auto}
.ring{position:absolute;inset:0}.rt,.rp{stroke-linejoin:round}.rt{fill:none;stroke:#fff3;stroke-width:1.2}
.rp{fill:none;stroke:var(--c1);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.disc{position:absolute;inset:7%;overflow:hidden;border-radius:50%;animation:sp 8s linear infinite;animation-play-state:paused;box-shadow:0 0 36px -8px color-mix(in srgb,var(--c1) 80%,transparent);will-change:transform;
background:repeating-radial-gradient(circle,#0003 0 1px,#0000 1px 5px),conic-gradient(hsl(var(--hue) 70% 55%),hsl(calc(var(--hue) + 60) 75% 60%),hsl(calc(var(--hue) + 120) 70% 50%),hsl(var(--hue) 70% 55%))}
.disc.on{animation-play-state:running}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.disc{animation:none}}
.disc[data-sh=squircle]{border-radius:26%}
.disc[data-sh=hexagon]{border-radius:0;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.disc[data-sh=diamond]{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.disc[data-s=rings]{background:repeating-radial-gradient(circle,hsl(var(--hue) 70% 50%) 0 11px,hsl(var(--hue) 75% 72%) 11px 22px)}
.disc[data-s=solid]{background:hsl(var(--hue) 70% 55%)}
.disc[data-s=glass]{background:hsl(var(--hue) 22% 38%)}
.disc[data-s=aurora]{background:conic-gradient(from 30deg,hsl(var(--hue) 85% 60%),hsl(calc(var(--hue) + 90) 85% 60%),hsl(calc(var(--hue) + 180) 85% 60%),hsl(calc(var(--hue) + 270) 85% 60%),hsl(var(--hue) 85% 60%))}
.disc[data-s=vinyl]:not(.hascv)::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#0e121c;border:6px solid hsl(var(--hue) 60% 48%)}
.disc[data-s=glass]:not(.hascv)::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font-size:min(30vw,120px);color:#fffa}
.cv{position:absolute;inset:0}.cv img,.cv video{width:100%;height:100%;object-fit:cover;display:block}
.ft{width:100%;display:flex;align-items:center;gap:10px;text-align:center}.ft div{flex:1;min-width:0}.ft p{margin:0;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ft small{opacity:.65}
#fav.on{color:#ff6b6b}
.sk{width:100%;display:flex;gap:10px;align-items:center;font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}.sk input{flex:1;accent-color:var(--c1)}
.ct{display:flex;align-items:center;gap:8px;margin:6px 0}.ct .ib{color:#fffb}.ct .on{color:var(--c1)}
.ct .pp{width:68px;height:68px;background:#fff;color:#111;font-size:26px}
.vl{width:100%;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;opacity:.85}.vl input{max-width:150px}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:46%;overflow:auto;overscroll-behavior:contain;background:#171d2c;border-radius:24px 24px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;z-index:5}
.sheet.open{transform:none}.sheet .r{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.sheet .in,.sheet select{background:#0e121c;border-color:#27304a;color:#fff}.sheet .btn{background:#0e121c;border-color:#27304a;color:#fff}
#eqb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}#eqb label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
#eqb input{writing-mode:vertical-lr;direction:rtl;height:120px;width:28px;accent-color:var(--ac)}
#viz{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#bgm{position:absolute;inset:0;z-index:0}#bgm::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,calc(var(--dm,.8)*.9)),#0000 30%,#0000 50%,rgba(0,0,0,calc(var(--dm,.8)*1.06)))}
#bgm img,#bgm video{width:100%;height:100%;object-fit:cover;display:block}
#full>:not(#bgm):not(.sheet):not(#fl):not(#fxc):not(#badj):not(#viz){position:relative;z-index:1}.sheet{z-index:5}
.disc[data-mo=none]{animation-name:none}
.disc[data-mo=sway]{animation-name:sw;animation-timing-function:ease-in-out;animation-direction:alternate}
.disc[data-mo=float]{animation-name:fl;animation-timing-function:ease-in-out;animation-direction:alternate}
@keyframes sw{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}@keyframes fl{from{transform:translateY(-4%)}to{transform:translateY(4%)}}
.sheet input[type=color]{width:44px;height:34px;padding:0;border:0;background:none;margin-left:6px}
.fh,.ft,.sk,.vl,.ct{max-width:560px}
.sk input,.vl input{accent-color:var(--c1)}.vl input{flex:1;max-width:none}
.sheet{max-width:560px;margin:0 auto}
#fl{position:absolute;inset:0;z-index:2;pointer-events:none;background:#fff;opacity:0}#fl.on{animation:fb .28s}@keyframes fb{0%{opacity:.5}100%{opacity:0}}
.stage.bs{animation:bs .22s}@keyframes bs{25%{transform:translate(-3%,2%) rotate(-1.5deg)}50%{transform:translate(3%,-2%) rotate(1.5deg)}75%{transform:translate(-2%,-1%)}}
.stage.bg2{animation:gl .25s}@keyframes gl{20%{filter:drop-shadow(7px 0 #f0f) drop-shadow(-7px 0 #0ff);transform:translateX(-2%)}60%{filter:drop-shadow(-6px 0 #f0f) drop-shadow(6px 0 #0ff);transform:translateX(2%)}100%{filter:none}}
#lyr{margin:0;max-width:560px;width:100%;min-height:1.4em;text-align:center;font-size:15px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#full.imm .fh,#full.imm .sk,#full.imm .ct,#full.imm .vl,#full.imm .ft>button{opacity:0;pointer-events:none}
#full.imm .stage{width:min(90vw,62vh,440px)}#full.imm #bgm::after{background:none}
.sel .cb{display:none}.card.sl .art{outline:3px solid var(--ac);outline-offset:-3px}
#full{text-shadow:0 1px 6px #000a}
#qs{max-height:70%}
.glow{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 70%,transparent) 30%,transparent 70%);opacity:.12;pointer-events:none;will-change:opacity}
#fxc{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#bgm img,#bgm video{will-change:transform}
.stabs{display:flex;gap:6px;overflow:auto;position:sticky;top:-16px;z-index:3;background:#171d2c;padding:8px 0;margin:4px 0}
.stabs button{padding:6px 14px;border-radius:99px;border:1px solid #27304a;background:#0e121c;color:#fff;white-space:nowrap}
.stabs button.on{background:var(--c1);color:#000;border-color:var(--c1);font-weight:700}
.sheet .r.hid{display:none}
.sheet input[type=range]{accent-color:var(--c1);flex:1;min-width:120px;max-width:60%}
#badj{display:none;position:absolute;inset:0;z-index:6;touch-action:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding:24px 20px calc(30px + env(safe-area-inset-bottom,0px))}
#full.badj #badj{display:flex}#full.badj>*:not(#bgm):not(#badj){opacity:0;pointer-events:none}#full.badj #bgm::after{background:none}
.hb{display:flex}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center;font-size:14px}#toast.on{opacity:1;transform:translate(-50%,0)}
.bdg{position:absolute;left:6px;top:6px;background:#e5484d;color:#fff;border-radius:99px;padding:1px 8px;font-size:11px;pointer-events:none}
.hd2{cursor:grab;touch-action:none;user-select:none;padding:8px 10px;color:var(--mu);font-size:18px}.drow.dragging{opacity:.55;outline:2px solid var(--ac)}.drow{touch-action:pan-y}
#full.locked :is(.fh,.ft,.sk,.ct,.vl,.stage){pointer-events:none}#full.locked :is(.sk,.ct,.vl,.ft){opacity:.4}#full.locked #flk{pointer-events:auto;color:var(--c1)}#full.locked .sheet{display:none}
.stage.bz{animation:bz .22s}@keyframes bz{30%{transform:scale(1.14)}100%{transform:scale(1)}}
.stage.bt{animation:bt .25s}@keyframes bt{30%{transform:rotate(-7deg) scale(1.05)}65%{transform:rotate(5deg)}100%{transform:none}}
.disc[data-s=neon]{background:radial-gradient(circle,#0b0e16 52%,var(--c1) 53% 57%,#0b0e16 58% 70%,var(--c2) 71% 74%,#0b0e16 75%)}
.disc[data-s=crystal]{background:repeating-conic-gradient(from 0deg,var(--c1) 0 15deg,var(--c2) 15deg 30deg,var(--c3) 30deg 45deg)}
.disc[data-s=galaxy]{background:radial-gradient(circle at 30% 30%,var(--c2),transparent 55%),radial-gradient(circle at 72% 70%,var(--c1),transparent 55%),radial-gradient(circle at 60% 25%,var(--c3),transparent 40%),#0b0e16}
#qfx{background:#0e121c;color:#fff;border-color:#27304a;max-width:44%}
</style></head>
<body>
<div class="top"><div class="hd"><h1>Mi música</h1><div><button class="btn" id="exp">Exportar</button> <button class="btn m" id="add">+ Añadir</button></div></div>
<div class="tabs"><button class="tab" data-v="songs">Canciones</button><button class="tab" data-v="lists">Listas</button><button class="tab" data-v="favs">Favoritas</button><button class="tab" data-v="set">Ajustes</button></div></div>
<div id="main"></div><div class="menu" id="menu" hidden></div><div id="toast"></div>
<div id="mini" hidden><div id="mart"></div><div id="mn"></div><button class="ib" id="mpp" aria-label="Reproducir">▶</button><button class="ib" id="mnx" aria-label="Siguiente">⏭</button></div>

<section id="full" aria-label="Reproduciendo"><div id="bgm"></div><canvas id="fxc"></canvas><canvas id="viz"></canvas><div id="badj"><span>Arrastra para mover · pellizca para hacer zoom</span><button class="btn m" id="bdone">Listo</button></div>
 <div class="fh"><button class="ib" id="fclose" aria-label="Cerrar">⌄</button><div><small>Reproduciendo desde</small><b id="from">Canciones</b></div><span class="hb"><button class="ib" id="flk" aria-label="Bloquear"></button><button class="ib" id="fmore" aria-label="Personalizar">⋮</button></span></div>
 <div class="stage" id="stage"><div class="glow" id="glow"></div><svg class="ring" viewBox="0 0 100 100"><path class="rt" id="rt" d="M50 2A48 48 0 0 1 50 98A48 48 0 0 1 50 2"/><path class="rp" id="rp" pathLength="100" d="M50 2A48 48 0 0 1 50 98A48 48 0 0 1 50 2"/></svg><div class="disc" id="disc" data-s="vinyl" data-sh="circle"><div class="cv" id="cv"></div></div></div>
 <div class="ft"><button class="ib" id="fav" aria-label="Favorita">♡</button><div><p id="ft">Nada sonando</p><small id="fs"></small></div><button class="ib" id="fq" aria-label="Cola">≡</button></div><p id="lyr"></p>
 <div class="sk"><span id="cu">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición"><span id="du">0:00</span></div>
 <div class="ct"><button class="ib" id="shuf" aria-label="Aleatorio">⇄</button><button class="ib" id="prev" aria-label="Anterior">⏮</button><button class="ib pp" id="pp" aria-label="Reproducir">▶</button><button class="ib" id="next" aria-label="Siguiente">⏭</button><button class="ib" id="rep" aria-label="Repetir">↻</button></div>
 <div class="vl"><span>Vol</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volumen"><select class="sel" id="qfx" aria-label="Efecto de audio"></select></div>
 <div class="sheet" id="cust">
  <b>Personalizar esta canción</b><div class="stabs" id="stabs"></div>
  <div class="r"><button class="btn" id="aut">Auto (según la foto)</button><button class="btn" id="sur">Sorpréndeme</button></div>
  <label class="r">Nombre <input class="in" id="cn"></label>
  <label class="r">Color <input type="range" id="ch" min="0" max="360"></label>
  <label class="r">Estilo <select class="sel" id="cs"><option value="vinyl">Vinilo</option><option value="rings">Anillos</option><option value="solid">Sólido</option><option value="glass">Cristal</option><option value="aurora">Aurora</option><option value="custom">Mis colores</option><option value="neon">Neón</option><option value="crystal">Cristal facetado</option><option value="galaxy">Galaxia</option></select></label>
  <div class="r"><span>Colores (mezcla)</span><span><input type="color" id="k0" aria-label="Color 1"><input type="color" id="k1" aria-label="Color 2"><input type="color" id="k2" aria-label="Color 3"></span></div>
  <label class="r">Degradado <select class="sel" id="cg"><option value="linear">Lineal</option><option value="radial">Radial</option><option value="conic">Cónico</option><option value="solid">Un solo color</option></select></label>
  <label class="r">Movimiento del disco <select class="sel" id="cm"><option value="spin">Girar</option><option value="none">Quieto</option><option value="sway">Balanceo</option><option value="float">Flotar</option></select></label>
  <label class="r">Velocidad <select class="sel" id="cp"><option value="14">Lenta</option><option value="8">Normal</option><option value="4">Rápida</option></select></label>
  <label class="r">Efecto con el sonido <select class="sel" id="cz"><option value="wave">Ondas (anillo)</option><option value="bars">Barras</option><option value="vapor">Vapor</option><option value="sparks">Chispas</option><option value="snow">Nieve</option><option value="ripple">Ondas expansivas</option><option value="rays">Rayos de luz</option><option value="orbit">Órbita</option><option value="off">Ninguno</option></select></label>
  <label class="r">Efecto de pantalla <select class="sel" id="z2"><option value="">Ninguno</option><option value="floor">Barras abajo</option><option value="smoke">Humo en las esquinas</option><option value="stars">Estrellas</option><option value="embers">Brasas que suben</option><option value="rain">Lluvia neón</option><option value="fire">Luciérnagas</option><option value="aurora">Aurora boreal</option><option value="matrix">Código (matrix)</option><option value="bubbles">Burbujas</option><option value="petals">Pétalos</option><option value="confetti">Confeti</option><option value="lightning">Relámpagos</option><option value="scan">Pantalla antigua (CRT)</option></select></label>
  <label class="r">Color de partículas <select class="sel" id="pc"><option value="">Automático</option><option value="k0">Color 1</option><option value="k1">Color 2</option><option value="k2">Color 3</option><option value="w">Blanco</option><option value="rb">Arcoíris</option><option value="x">Elegir…</option></select></label>
  <div class="r"><span>Color elegido</span><input type="color" id="pcc" value="#ffffff"></div>
  <label class="r">Cantidad <select class="sel" id="pa"><option value="l">Poca</option><option value="">Normal</option><option value="h">Mucha</option></select></label>
  <label class="r">Fondo <select class="sel" id="cb"><option value="auto">Automático</option><option value="grad">Degradado con mis colores</option><option value="media">Imagen o video</option><option value="black">Negro</option></select></label>
  <div class="r"><button class="btn" id="bimg">Fondo: imagen o video</button><button class="btn" id="bdel">Quitar fondo</button></div>
  <label class="r">Zoom <input type="range" id="bz" min="50" max="400" value="100"></label>
  <label class="r">Transparencia <input type="range" id="bo" min="10" max="100" value="100"></label>
  <label class="r">Oscurecer <input type="range" id="dm" min="0" max="100" value="80"></label>
  <label class="r">Desenfoque <input type="range" id="bl" min="0" max="20" value="0"></label>
  <div class="r"><button class="btn" id="badjb">Mover y recortar</button><button class="btn" id="bcen">Centrar</button></div>
  <input type="file" id="bfile" accept="image/*,video/*" hidden>
  <label class="r">Efecto de audio <select class="sel" id="cx"><option value="">Normal</option><option value="slow">Slowed + reverb</option><option value="ssl">Super slowed</option><option value="vapor">Vaporwave</option><option value="fast">Sped up</option><option value="nc">Nightcore fuerte</option><option value="rev">Solo reverb</option><option value="bass">Bass boost</option><option value="phonk">Phonk (graves + saturación)</option><option value="echo">Eco</option><option value="d8">8D (gira entre oídos)</option><option value="radio">Radio / teléfono</option><option value="muff">Desde otra habitación</option><option value="sat">Saturación</option></select></label>
  <label class="r">Intensidad del efecto <input type="range" id="cfi" min="20" max="150" value="100" aria-label="Intensidad"></label>
  <label class="r">Ecualizador <select class="sel" id="cq"></select></label>
  <label class="r">Efecto al ritmo <select class="sel" id="ce"><option value="">Ninguno</option><option value="shake">Sacudida</option><option value="flash">Destello</option><option value="glitch">Glitch de color</option><option value="zoom">Zoom al ritmo</option><option value="tilt">Inclinación</option><option value="strobe">Estroboscopio</option><option value="invert">Inversión de color</option></select></label>

<script>
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const A=new Audio();A.volume=.8;
let tracks=[],by={},cur=null,ids=[],shuf=false,rep=0,view='songs',open=null,sortM='add',lists={},favs=new Set(),meta={},eqv=[0,0,0,0,0],db,cov={},ctx,filt=[],an,fd,stopEnd=false,sleepT,raf=0,q='',from='Canciones';
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim();
const fmt=t=>{if(!isFinite(t))return'0:00';const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=String(Math.floor(t%60)).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+s:m+':'+s};
const nm=t=>(meta[t.id]||{}).n||t.name,hu=t=>(meta[t.id]||{}).h??hash(t.name),mm=t=>meta[t.id]||(meta[t.id]={});
const sv=()=>{try{localStorage.setItem('mm-prefs',JSON.stringify({favs:[...favs],lists,tpl,plays,rec,fade,eq:eqv,sort:sortM,spd:gspd,shuffle:shuf,repeat:rep,theme:document.documentElement.dataset.theme||''}));localStorage.setItem('mm-meta',JSON.stringify(meta))}catch(e){}};

/* Almacenamiento (IndexedDB): t = canciones, c = portadas */
const idb=()=>new Promise(r=>{try{const o=indexedDB.open('mi-musica',2);o.onupgradeneeded=()=>{const d=o.result;['t','c'].forEach(n=>d.objectStoreNames.contains(n)||d.createObjectStore(n,{keyPath:'id'}))};o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r()}catch(e){r()}});
const os=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const all=s=>new Promise(r=>{try{const g=os(s).getAll();g.onsuccess=()=>r(g.result||[]);g.onerror=()=>r([])}catch(e){r([])}});
const put=(s,o)=>{try{os(s,'readwrite').put(o)}catch(e){}},del=(s,id)=>{try{os(s,'readwrite').delete(id)}catch(e){}};

/* Elementos visuales */
function media(t,small){return mk(cov[t.id],small)}
function mk(c,small){if(!c)return null;if(c.type==='video'&&small)return null;const v=c.type==='video',e=document.createElement(v?'video':'img');e.src=c.url+(v&&small?'#t=0.1':'');if(v){e.muted=true;e.loop=true;e.playsInline=true;if(small)e.preload='metadata';else e.autoplay=true}else e.alt='';return e}
function art(t){const d=el('div','art');d.style.setProperty('--h',hu(t));const m=media(t,true)||(cov['th-'+t.id]?mk(cov['th-'+t.id],true):null);if(m)d.appendChild(m);else d.textContent='♪';return d}
const shown=()=>tracks.filter(t=>(view==='favs'?favs.has(t.id):view==='lists'&&open?(lists[open]||[]).includes(t.id):true)&&(!q||nm(t).toLowerCase().includes(q))&&(!dupOnly||dupIds.has(t.id)));
const cmp={top:(a,b)=>(plays[b.id]||0)-(plays[a.id]||0),rec:(a,b)=>(rec[b.id]||0)-(rec[a.id]||0),add:(a,b)=>parseInt(a.id)-parseInt(b.id),az:(a,b)=>nm(a).localeCompare(nm(b),'es'),za:(a,b)=>nm(b).localeCompare(nm(a),'es')};

function card(t){const c=el('div','card'+(t.id===cur?' cur':'')+(selS.has(t.id)?' sl':''));c.dataset.id=t.id;c.appendChild(art(t));if(dupIds.has(t.id))c.appendChild(el('span','bdg','Duplicada'));const n=el('div','cn');n.textContent=nm(t);c.appendChild(n);
  const f=favs.has(t.id);c.appendChild(el('div','cb',"<button class='fv"+(f?' on':'')+"' aria-label='Favorita'>"+(f?'♥':'♡')+"</button><button class='pl' aria-label='Añadir a lista'>＋</button><button class='rm' aria-label='Quitar'>✕</button>"));
  c.onclick=e=>{if(sel){selS.has(t.id)?selS.delete(t.id):selS.add(t.id);c.classList.toggle('sl',selS.has(t.id));selCount();return}const x=e.target.closest('button');if(!x)return play(t.id,shown().map(s=>s.id),true);
    if(x.classList.contains('fv')){favs.has(t.id)?favs.delete(t.id):favs.add(t.id);sv();drawGrid();favUI()}
    else if(x.classList.contains('pl'))menu(t.id,x);
    else if(view==='lists'&&open){lists[open]=lists[open].filter(i=>i!==t.id);sv();drawGrid()}
    else if(confirm('¿Quitar esta canción de tu biblioteca?'))rm(t)};
  return c}
function rm(t){del('t',t.id);del('c',t.id);del('c','bg-'+t.id);del('c','th-'+t.id);favs.delete(t.id);delete meta[t.id];for(const k in lists)lists[k]=lists[k].filter(x=>x!==t.id);
  tracks=tracks.filter(x=>x!==t);delete by[t.id];ids=ids.filter(x=>x!==t.id);if(cur===t.id){A.pause();A.removeAttribute('src');cur=null;skin(true)}sv();drawGrid();mini()}
function drawGrid(){const g=$('#grid');if(!g)return;calcDups();sortT();g.innerHTML='';const l=shown();if(view==='lists'&&open)return listRows(g,l);if(dupOnly)l.sort((x,y)=>nk(x.name).localeCompare(nk(y.name)));
  if(!l.length){g.className='';g.innerHTML=tracks.length?"<div class='empty'>Nada por aquí todavía.</div>":"<div class='empty'><b>Tu biblioteca está vacía</b>Pulsa “+ Añadir” y elige varias canciones de tu celular a la vez.</div>";return}
  g.className='grid';l.forEach(t=>g.appendChild(card(t)));const c=$('#cnt');if(c)c.textContent=l.length+' canciones'}
const sortT=()=>tracks.sort(cmp[sortM]||cmp.add);

function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===view));const m=$('#main');m.innerHTML='';m.classList.toggle('sel',sel);
  if(view==='set')return settings(m);
  if(view==='lists'&&!open){const b=el('div','bar',"<input class='in' id='nl' placeholder='Nueva lista' aria-label='Nombre de la lista'><button class='btn m' id='mk'>Crear</button>");m.appendChild(b);
    b.querySelector('#mk').onclick=()=>{const n=$('#nl').value.trim();if(n&&!lists[n]){lists[n]=[];sv();render()}};
    const ks=Object.keys(lists);if(!ks.length)m.appendChild(el('div','empty',"<b>Sin listas</b>Crea una y añade canciones con el botón ＋ de cada tarjeta."));
    ks.forEach(n=>{const r=el('div','row');r.innerHTML='<b></b><span>'+lists[n].length+' canciones</span>';r.firstChild.textContent=n;r.onclick=()=>{open=n;render()};m.appendChild(r)});return}
  const b=el('div','bar');
  if(view==='lists'){const bk=el('button','btn','← Listas');bk.onclick=()=>{open=null;q='';render()};const t=el('b');t.textContent=open;const d=el('button','btn','Borrar lista');d.onclick=()=>{if(confirm('¿Borrar esta lista?')){delete lists[open];open=null;sv();render()}};b.append(bk,t,d);m.appendChild(b);}
  const b2=el('div','bar',"<input class='in' id='sq' type='search' placeholder='Buscar' aria-label='Buscar'><span id='cnt'></span>");b2.firstChild.value=q;b2.firstChild.oninput=e=>{q=e.target.value.toLowerCase();drawGrid()};
  if(view==='songs'){const s=el('select','sel',"<option value='add'>Añadidas</option><option value='az'>A–Z</option><option value='za'>Z–A</option><option value='top'>Más escuchadas</option><option value='rec'>Recientes</option>");s.value=sortM;s.onchange=e=>{sortM=e.target.value;sv();drawGrid()};b2.appendChild(s)}
  const sb=el('button','btn',sel?'Cancelar':'Seleccionar');sb.onclick=()=>{sel=!sel;selS.clear();render()};b2.appendChild(sb);calcDups();if(dupIds.size||dupOnly){const db=el('button','btn',dupOnly?'Ver todas':'Duplicadas ('+dupIds.size+')');db.onclick=()=>{dupOnly=!dupOnly;render()};b2.appendChild(db)}m.appendChild(b2);if(sel)m.appendChild(selBar());m.appendChild(el('div','','')).id='grid';drawGrid()}

function settings(m){
  m.innerHTML="<h3>Apariencia</h3><button class='btn' id='th'>Cambiar claro / oscuro</button><h3>Reproducción</h3><div class='bar'><label>Velocidad <select class='sel' id='spd'><option value='0.75'>0.75x</option><option value='1'>1x</option><option value='1.25'>1.25x</option><option value='1.5'>1.5x</option><option value='2'>2x</option></select></label><label>Apagar en <select class='sel' id='sl'><option value='0'>No</option><option value='15'>15 min</option><option value='30'>30 min</option><option value='45'>45 min</option><option value='60'>60 min</option><option value='end'>Al terminar la canción</option></select></label><label>Fundido <select class='sel' id='fd'><option value='0'>No</option><option value='2'>2 s</option><option value='4'>4 s</option><option value='6'>6 s</option></select></label></div><h3>Rendimiento</h3><div class='bar'><select class='sel' id='pf'><option value='auto'>Automático (recomendado)</option><option value='high'>Calidad máxima</option><option value='low'>Ahorro de batería</option></select></div><p style='color:var(--mu)'>Automático baja los efectos solo si el celular se atasca.</p><h3>Ecualizador</h3><select class='sel' id='pre'></select><div id='eqb'></div><h3>Efectos de audio</h3><div class='bar'><select class='sel' id='gfx'></select><button class='btn' id='gfa'>Aplicar a todas</button></div><label style='display:block;margin:8px 0'><input type='checkbox' id='nm'> Igualar volumen entre canciones (compresor)</label><h3>Organizar</h3><div class='bar'><button class='btn' id='rd'>Quitar copias exactas</button><button class='btn' id='aa'>Estilo automático para todas</button><button class='btn' id='sa'>Sorpresa para todas</button></div><label style='display:block;margin:8px 0'><input type='checkbox' id='ac'> Aplicar Auto cuando pongo una portada</label><p id='dm' style='color:var(--mu)'></p><h3>Copia de seguridad</h3><div class='bar'><button class='btn' id='ex'>Exportar copia</button><button class='btn' id='im'>Importar copia</button></div><p id='bk' style='color:var(--mu)'>Guarda canciones, portadas, listas y estilos en un solo archivo. Con muchas canciones puede tardar y pesar bastante.</p><input type='file' id='imf' hidden><h3>Ayuda</h3><p style='color:var(--mu)'>Tus canciones, portadas y ajustes se guardan en este dispositivo y funcionan sin conexión. No borres los datos del sitio desde los ajustes del celular o perderás la biblioteca.</p>";
  $('#th').onclick=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dk?'light':'dark';sv();tc()};
  $('#fd').value=String(fade);$('#fd').onchange=e=>{fade=+e.target.value;sv()};calcDups();$('#dm').textContent=dupIds.size?dupIds.size+' canciones con nombre repetido: míralas en Canciones → Duplicadas.':'No hay nombres repetidos.';$('#gfx').innerHTML=$('#cx').innerHTML;$('#gfa').onclick=()=>{const v=$('#gfx').value;if(!tracks.length||!confirm('¿Aplicar este efecto de audio a todas las canciones?'))return;tracks.forEach(t=>{const m=mm(t);if(v)m.fx=v;else delete m.fx});sv();applyFx();toast('Efecto aplicado a '+tracks.length+' canciones')};$('#nm').checked=localStorage.getItem('mm-norm')==='1';$('#nm').onchange=e=>{try{localStorage.setItem('mm-norm',e.target.checked?'1':'0')}catch(x){}applyFx()};$('#ac').checked=localStorage.getItem('mm-ac')==='1';$('#ac').onchange=e=>{try{localStorage.setItem('mm-ac',e.target.checked?'1':'0')}catch(x){}};$('#rd').onclick=rmDups;$('#aa').onclick=()=>allStyle(autoStyle);$('#sa').onclick=()=>allStyle(surprise);$('#ex').onclick=exportAll;$('#im').onclick=()=>$('#imf').click();$('#imf').onchange=e=>{importAll(e.target.files[0]);e.target.value=''};$('#spd').value=String(gspd);$('#spd').onchange=e=>{gspd=+e.target.value;applyFx();sv()};
  $('#pf').value=perfM;$('#pf').onchange=e=>{perfM=e.target.value;try{localStorage.setItem('mm-perf',perfM)}catch(x){}Q=perfM==='high'?2:perfM==='low'?0:Math.min(Q,2);P=[];PS=[]};
  $('#sl').onchange=e=>{clearTimeout(sleepT);stopEnd=false;const v=e.target.value;if(v==='end')stopEnd=true;else if(+v>0)sleepT=setTimeout(()=>{A.pause()},+v*6e4)};
  const PRE={'Plano':[0,0,0,0,0],'Más graves':[7,4,0,0,0],'Voces':[-2,0,4,3,0],'Más agudos':[0,0,0,4,7],'Rock':[5,3,-2,3,5],'Pop':[-1,3,4,2,-1]},N=['60 Hz','230','910','3.6k','14k'];
  const pre=$('#pre');pre.innerHTML='<option value="">Personalizado</option>'+Object.keys(PRE).map(k=>'<option>'+k+'</option>').join('');pre.value=Object.keys(PRE).find(k=>PRE[k].join()===eqv.join())||'';
  N.forEach((n,i)=>{const l=el('label','',"<input type='range' min='-12' max='12' aria-label='"+n+"'><span>"+n+'</span>'),r=l.firstChild;r.value=eqv[i];r.oninput=()=>{eqv[i]=+r.value;if(filt[i])filt[i].gain.value=eqv[i];pre.value='';sv()};$('#eqb').appendChild(l)});
  pre.onchange=e=>{const p=PRE[e.target.value];if(!p)return;eqv=[...p];filt.forEach((f,i)=>f.gain.value=eqv[i]);document.querySelectorAll('#eqb input').forEach((r,i)=>r.value=eqv[i]);sv()}}

/* Menú ＋ listas */
function menu(id,btn){const m=$('#menu'),ks=Object.keys(lists);m.innerHTML='';[['Reproducir siguiente',()=>{ids=ids.filter(x=>x!==id);ids.splice(ids.indexOf(cur)+1,0,id)}],['Añadir a la cola',()=>{ids=ids.filter(x=>x!==id);ids.push(id)}],['Descargar archivo',()=>dl(by[id])]].forEach(([n,f])=>{const b=el('button');b.textContent=n;b.onclick=()=>{f();m.hidden=true};m.appendChild(b)});if(!ks.length){const p=el('p','','Crea una lista en la pestaña Listas para guardar canciones');p.style.cssText='padding:8px;margin:0';m.appendChild(p)}
  ks.forEach(n=>{const b=el('button');b.textContent=n;b.onclick=()=>{if(!lists[n].includes(id))lists[n].push(id);sv();m.hidden=true};m.appendChild(b)});
  const r=btn.getBoundingClientRect();m.style.top=r.bottom+scrollY+'px';m.style.left=Math.max(8,r.right+scrollX-180)+'px';m.hidden=false}
document.addEventListener('click',e=>{if(!e.target.closest('#menu,.pl'))$('#menu').hidden=true});

/* Reproducción */
function play(id,list,openFull){const t=by[id];if(!t)return;if(list)ids=list;from=view==='favs'?'Favoritas':view==='lists'&&open?open:'Canciones';loopA=loopB=null;$('#la').textContent='Inicio';$('#lb').textContent='Fin';plays[id]=(plays[id]||0)+1;rec[id]=Date.now();sv();cur=id;try{localStorage.setItem('mm-last',id)}catch(e){}A.src=t.url;skin(true);if($('#qs').classList.contains('open'))drawQ();A.play().catch(()=>{});if(openFull)$('#full').classList.add('open');
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('cur',c.dataset.id===id))}
function nx(auto){if(!ids.length)return;if(auto&&rep===2)return play(cur);if(shuf&&ids.length>1){let n;do{n=ids[Math.random()*ids.length|0]}while(n===cur);return play(n)}let k=ids.indexOf(cur)+1;if(k>=ids.length){if(rep===1||!auto)k=0;else{A.pause();return}}play(ids[k])}
function pv(){if(A.currentTime>3)A.currentTime=0;else{const k=ids.indexOf(cur);play(ids[k<=0?ids.length-1:k-1])}}
function tg(){if(!cur){const l=shown();if(l.length)play(l[0].id,l.map(x=>x.id));return}A.paused?A.play().catch(()=>{}):A.pause()}

function skin(rebuild){const t=by[cur],r=document.documentElement,d=$('#disc');r.style.removeProperty('--ac');r.style.removeProperty('--ai');
  if(rebuild)$('#cv').innerHTML='';
  if(!t){r.style.setProperty('--hue',225);r.style.setProperty('--c1','#7aa2ff');d.classList.remove('hascv');$('#ft').textContent='Nada sonando';$('#fs').textContent='';document.title='Mi música';mini();return}
  const m=meta[t.id]||{};r.style.setProperty('--hue',hu(t));d.dataset.s=m.s||'vinyl';d.dataset.sh=m.sh||'circle';{const dd=RING[m.sh||'circle'];$('#rt').setAttribute('d',dd);$('#rp').setAttribute('d',dd)}const k=cols(t);r.style.setProperty('--c1',k[0]);r.style.setProperty('--c2',k[1]);r.style.setProperty('--c3',k[2]);d.dataset.mo=m.mo||'spin';d.style.animationDuration=(m.sp||8)+'s';d.style.background=m.s==='custom'?grad(m,k):'';bgSkin(t,m,k);bgFx(m);ly=parseLy(m.ly||'');li=-2;$('#lyr').textContent='';applyFx();
  if(rebuild){const md=media(t,false);if(md)$('#cv').appendChild(md);d.classList.toggle('hascv',!!md);fill(t)}
  if(m.a){r.style.setProperty('--ac',k[0]);r.style.setProperty('--ai','#fff')}
  $('#ft').textContent=nm(t);$('#fs').textContent=(ids.indexOf(cur)+1)+' / '+ids.length;$('#from').textContent=from;document.title=nm(t)+' · Mi música';
  favUI();mini();vsync();try{navigator.mediaSession.metadata=new MediaMetadata({title:nm(t),artist:'Mi música'})}catch(e){}}
function mini(){const t=by[cur],m=$('#mini');m.hidden=!t;if(!t)return;$('#mart').replaceChildren(art(t));$('#mn').textContent=nm(t)}
function favUI(){const b=$('#fav'),f=favs.has(cur);b.textContent=f?'♥':'♡';b.classList.toggle('on',f)}
function vsync(){const go=!A.paused&&!document.hidden&&$('#full').classList.contains('open');document.querySelectorAll('#cv video,#bgm video').forEach(v=>go?v.play().catch(()=>{}):v.pause())}
function ui(){const on=!A.paused&&!!A.src;$('#pp').innerHTML=$('#mpp').innerHTML=on?PAUSE:PLAY;$('#disc').classList.toggle('on',on);vsync();if(on&&!raf)raf=requestAnimationFrame(tick)}

/* Audio: ecualizador + análisis de graves */
function ensureCtx(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:"playback"});let n=ctx.createMediaElementSource(A);[60,230,910,3600,14000].forEach((f,i)=>{const b=ctx.createBiquadFilter();b.type=i?i==4?'highshelf':'peaking':'lowshelf';b.frequency.value=f;b.gain.value=eqv[i];filt.push(b);n.connect(b);n=b});an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.55;fd=new Uint8Array(512);out=ctx.createGain();conv=ctx.createConvolver();conv.buffer=impulse(ctx);wet=ctx.createGain();wet.gain.value=0;sh=ctx.createWaveShaper();sh.oversample='2x';pan=ctx.createStereoPanner();hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=10;lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=22000;lfo=ctx.createOscillator();lfo.frequency.value=.13;lg=ctx.createGain();lg.gain.value=0;lfo.connect(lg);lg.connect(pan.pan);lfo.start();dly=ctx.createDelay(1.5);dly.delayTime.value=.34;fbk=ctx.createGain();fbk.gain.value=.42;dg=ctx.createGain();dg.gain.value=0;dly.connect(fbk);fbk.connect(dly);dly.connect(dg);dg.connect(an);comp=ctx.createDynamicsCompressor();n.connect(sh);sh.connect(pan);pan.connect(hp);hp.connect(lp);lp.connect(comp);comp.connect(an);lastN=lp;conv.connect(wet);wet.connect(an);an.connect(out);out.connect(ctx.destination);applyFx()}catch(e){ctx=null}}
function tick(now){raf=0;const st=$('#stage');
  if(!an||A.paused||!cur||document.hidden||!$('#full').classList.contains('open')){st.style.transform='';$('#glow').style.opacity=0;clr();return}
